<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2436" viewBox="0 0 860 2436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2436" fill="#0d1117"/>
<rect x="28" y="16" width="804" height="270" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="40" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="50" y="64" font-size="13.5" fill="#e6edf3" >• launchd schedule, no daemon</text>
<text x="62" y="84" font-size="13.5" fill="#e6edf3" >between ticks</text>
<text x="50" y="104" font-size="13.5" fill="#e6edf3" >• dollar budget, timeout, turn</text>
<text x="62" y="124" font-size="13.5" fill="#e6edf3" >cap</text>
<text x="50" y="144" font-size="13.5" fill="#e6edf3" >• rolling daily budget</text>
<text x="50" y="164" font-size="13.5" fill="#e6edf3" >• read-only or sandboxed-write</text>
<text x="62" y="184" font-size="13.5" fill="#e6edf3" >policy</text>
<text x="50" y="204" font-size="13.5" fill="#e6edf3" >• overlap skip / allow / replace</text>
<text x="50" y="224" font-size="13.5" fill="#e6edf3" >• one-off runs: cones run</text>
<text x="62" y="244" font-size="13.5" fill="#e6edf3" >--prompt</text>
<text x="50" y="264" font-size="13.5" fill="#e6edf3" >• shared-workspace writer lock</text>
<text x="316" y="64" font-size="13.5" fill="#e6edf3" >• cones lock around any command</text>
<text x="316" y="84" font-size="13.5" fill="#e6edf3" >• opt-in failure notification</text>
<text x="316" y="104" font-size="13.5" fill="#e6edf3" >• durable JSONL run ledger</text>
<text x="316" y="124" font-size="13.5" fill="#e6edf3" >• dollars per run in ls and the</text>
<text x="328" y="144" font-size="13.5" fill="#e6edf3" >ledger</text>
<text x="316" y="164" font-size="13.5" fill="#e6edf3" >• live event stream</text>
<text x="316" y="184" font-size="13.5" fill="#e6edf3" >• fleet from Claude&#x27;s own</text>
<text x="328" y="204" font-size="13.5" fill="#e6edf3" >session registry, no hook</text>
<text x="316" y="224" font-size="13.5" fill="#e6edf3" >• every Claude session in ls and</text>
<text x="328" y="244" font-size="13.5" fill="#e6edf3" >the TUI</text>
<text x="582" y="64" font-size="13.5" fill="#e6edf3" >• stop and attach from CLI and</text>
<text x="594" y="84" font-size="13.5" fill="#e6edf3" >TUI</text>
<text x="582" y="104" font-size="13.5" fill="#e6edf3" >• dashboard: details pane,</text>
<text x="594" y="124" font-size="13.5" fill="#e6edf3" >dispatch, grouping</text>
<text x="582" y="144" font-size="13.5" fill="#e6edf3" >• key hints follow claude agents</text>
<text x="582" y="164" font-size="13.5" fill="#e6edf3" >• per-harness marks, spinners,</text>
<text x="594" y="184" font-size="13.5" fill="#e6edf3" >colors</text>
<text x="582" y="204" font-size="13.5" fill="#e6edf3" >• doctor: login, job env,</text>
<text x="594" y="224" font-size="13.5" fill="#e6edf3" >version drift, flags</text>
<text x="582" y="244" font-size="13.5" fill="#e6edf3" >• cones coordinator start, skill</text>
<text x="594" y="264" font-size="13.5" fill="#e6edf3" >in the binary</text>
<rect x="36" y="312" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="350" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="370" font-size="12.5" fill="#8b949e" >What the coordinator needs from cones</text>
<rect x="302" y="312" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="350" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="370" font-size="12.5" fill="#8b949e" >Claude only, no second writer needed</text>
<rect x="568" y="312" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="350" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="370" font-size="12.5" fill="#8b949e" >Needs a second writer, harness or Mac</text>
<rect x="28" y="386" width="804" height="316" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="398" width="5" height="292" rx="2.5" fill="#f0883e"/>
<text x="46" y="416" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="448" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="472" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="494" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="516" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="538" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="560" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="448" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="472" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="494" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="516" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="538" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="560" font-size="16" fill="#8b949e" >into the README.</text>
<text x="316" y="602" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="316" y="626" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="316" y="648" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="316" y="670" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="448" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="714" width="804" height="558" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="726" width="5" height="534" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="744" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text>
<text x="50" y="776" font-size="17" fill="#e6edf3" font-weight="700">Touched files</text>
<text x="50" y="800" font-size="16" fill="#8b949e" >Edit and Write paths read</text>
<text x="50" y="822" font-size="16" fill="#8b949e" >from the session&#x27;s</text>
<text x="50" y="844" font-size="16" fill="#8b949e" >transcript; ls --json and the</text>
<text x="50" y="866" font-size="16" fill="#8b949e" >details pane show each</text>
<text x="50" y="888" font-size="16" fill="#8b949e" >footprint. Bash edits are not</text>
<text x="50" y="910" font-size="16" fill="#8b949e" >seen.</text>
<text x="50" y="952" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="50" y="976" font-size="16" fill="#8b949e" >cones status &#x27;text&#x27; records a</text>
<text x="50" y="998" font-size="16" fill="#8b949e" >one-line check-in per session</text>
<text x="50" y="1020" font-size="16" fill="#8b949e" >that fills the last column,</text>
<text x="50" y="1042" font-size="16" fill="#8b949e" >so the orchestrator reads</text>
<text x="50" y="1064" font-size="16" fill="#8b949e" >check-ins instead of asking;</text>
<text x="50" y="1086" font-size="16" fill="#8b949e" >active/idle/blocked come from</text>
<text x="50" y="1108" font-size="16" fill="#8b949e" >Claude&#x27;s registry.</text>
<text x="316" y="776" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="800" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="822" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="844" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="866" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="888" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="910" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="952" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="976" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="998" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="1020" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="1042" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="1064" font-size="16" fill="#8b949e" >changed.</text>
<text x="316" y="1106" font-size="17" fill="#e6edf3" font-weight="700">Fleet sessions in the ledger</text>
<text x="316" y="1130" font-size="16" fill="#8b949e" >SessionEnd writes a session</text>
<text x="316" y="1152" font-size="16" fill="#8b949e" >record (cwd, duration,</text>
<text x="316" y="1174" font-size="16" fill="#8b949e" >tokens, dollars) for sessions</text>
<text x="316" y="1196" font-size="16" fill="#8b949e" >cones did not launch; ls</text>
<text x="316" y="1218" font-size="16" fill="#8b949e" >totals it, daily_budget_usd</text>
<text x="316" y="1240" font-size="16" fill="#8b949e" >ignores it.</text>
<text x="582" y="776" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="582" y="800" font-size="16" fill="#8b949e" >Enter on a foreign session</text>
<text x="582" y="822" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="582" y="844" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="582" y="866" font-size="16" fill="#8b949e" >there, instead of resuming a</text>
<text x="582" y="888" font-size="16" fill="#8b949e" >copy.</text>
<rect x="28" y="1284" width="804" height="668" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1296" width="5" height="644" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1314" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1346" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1346" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="316" y="1370" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="316" y="1392" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="316" y="1414" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="316" y="1436" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1346" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1370" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1392" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1414" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1436" font-size="16" fill="#8b949e" >gates the Codex adapter.</text>
<text x="582" y="1478" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1502" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1524" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1546" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1588" font-size="17" fill="#e6edf3" font-weight="700">Codex in the fleet</text>
<text x="582" y="1612" font-size="16" fill="#8b949e" >Codex keeps no session</text>
<text x="582" y="1634" font-size="16" fill="#8b949e" >registry: pid and cwd from</text>
<text x="582" y="1656" font-size="16" fill="#8b949e" >the process table, title and</text>
<text x="582" y="1678" font-size="16" fill="#8b949e" >last line from its rollout</text>
<text x="582" y="1700" font-size="16" fill="#8b949e" >file.</text>
<text x="582" y="1742" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="1766" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="1788" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="1810" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="1852" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="1876" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="1898" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="1920" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="1964" width="804" height="382" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1976" width="5" height="358" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1994" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">COORDINATION</text>
<text x="50" y="2026" font-size="17" fill="#e6edf3" font-weight="700">Lock holder in ls</text>
<text x="50" y="2050" font-size="16" fill="#8b949e" >Holder pid and session id</text>
<text x="50" y="2072" font-size="16" fill="#8b949e" >land beside the .lock; ls,</text>
<text x="50" y="2094" font-size="16" fill="#8b949e" >the dashboard and cones lock</text>
<text x="50" y="2116" font-size="16" fill="#8b949e" >--status show who holds and</text>
<text x="50" y="2138" font-size="16" fill="#8b949e" >who waits; --try exits 1, no</text>
<text x="50" y="2160" font-size="16" fill="#8b949e" >waiting.</text>
<text x="316" y="2026" font-size="17" fill="#e6edf3" font-weight="700">Other coordinators</text>
<text x="316" y="2050" font-size="16" fill="#8b949e" >cones coordinator start</text>
<text x="316" y="2072" font-size="16" fill="#8b949e" >--skill NAME launches any</text>
<text x="316" y="2094" font-size="16" fill="#8b949e" >coordinator skill, Claude</text>
<text x="316" y="2116" font-size="16" fill="#8b949e" >Code or another harness;</text>
<text x="316" y="2138" font-size="16" fill="#8b949e" >start-orchestrator stays the</text>
<text x="316" y="2160" font-size="16" fill="#8b949e" >default.</text>
<text x="582" y="2026" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2050" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2072" font-size="16" fill="#8b949e" >worktree; unlocks overlap:</text>
<text x="582" y="2094" font-size="16" fill="#8b949e" >allow for write jobs. Recipe</text>
<text x="582" y="2116" font-size="16" fill="#8b949e" >from claude-squad, ported as</text>
<text x="582" y="2138" font-size="16" fill="#8b949e" >git commands.</text>
<text x="582" y="2180" font-size="17" fill="#e6edf3" font-weight="700">Cross-harness coordination</text>
<text x="582" y="2204" font-size="16" fill="#8b949e" >The coordinator drives Claude</text>
<text x="582" y="2226" font-size="16" fill="#8b949e" >Code and Codex agents in one</text>
<text x="582" y="2248" font-size="16" fill="#8b949e" >folder alike: Codex arrivals</text>
<text x="582" y="2270" font-size="16" fill="#8b949e" >greeted, gated and relayed,</text>
<text x="582" y="2292" font-size="16" fill="#8b949e" >not only read from their</text>
<text x="582" y="2314" font-size="16" fill="#8b949e" >rollout files.</text>
<text x="28" y="2372" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and</text>
<text x="28" y="2392" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
</svg>