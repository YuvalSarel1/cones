<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2706" viewBox="0 0 860 2706" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2706" fill="#0d1117"/>
<rect x="28" y="16" width="804" height="630" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="40" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="50" y="64" font-size="13.5" fill="#e6edf3" >• launchd schedule, no daemon</text>
<text x="62" y="84" font-size="13.5" fill="#e6edf3" >between ticks</text>
<text x="50" y="104" font-size="13.5" fill="#e6edf3" >• dollar budget, timeout, turn</text>
<text x="62" y="124" font-size="13.5" fill="#e6edf3" >cap</text>
<text x="50" y="144" font-size="13.5" fill="#e6edf3" >• rolling daily budget</text>
<text x="50" y="164" font-size="13.5" fill="#e6edf3" >• read-only or sandboxed-write</text>
<text x="62" y="184" font-size="13.5" fill="#e6edf3" >policy</text>
<text x="50" y="204" font-size="13.5" fill="#e6edf3" >• overlap skip / allow / replace</text>
<text x="50" y="224" font-size="13.5" fill="#e6edf3" >• one-off runs: cones run</text>
<text x="62" y="244" font-size="13.5" fill="#e6edf3" >--prompt</text>
<text x="50" y="264" font-size="13.5" fill="#e6edf3" >• opt-in failure notification</text>
<text x="50" y="284" font-size="13.5" fill="#e6edf3" >• durable JSONL run ledger</text>
<text x="50" y="304" font-size="13.5" fill="#e6edf3" >• dollars per run in ls and the</text>
<text x="62" y="324" font-size="13.5" fill="#e6edf3" >ledger</text>
<text x="50" y="344" font-size="13.5" fill="#e6edf3" >• live event stream</text>
<text x="50" y="364" font-size="13.5" fill="#e6edf3" >• fleet from Claude&#x27;s own</text>
<text x="62" y="384" font-size="13.5" fill="#e6edf3" >session registry, no hook</text>
<text x="50" y="404" font-size="13.5" fill="#e6edf3" >• every Claude session in ls and</text>
<text x="62" y="424" font-size="13.5" fill="#e6edf3" >the TUI</text>
<text x="316" y="64" font-size="13.5" fill="#e6edf3" >• Codex sessions: process table,</text>
<text x="328" y="84" font-size="13.5" fill="#e6edf3" >rollout file, app-server</text>
<text x="328" y="104" font-size="13.5" fill="#e6edf3" >threads joined and left like</text>
<text x="328" y="124" font-size="13.5" fill="#e6edf3" >Claude</text>
<text x="316" y="144" font-size="13.5" fill="#e6edf3" >• model, start, activity and</text>
<text x="328" y="164" font-size="13.5" fill="#e6edf3" >context read from the</text>
<text x="328" y="184" font-size="13.5" fill="#e6edf3" >transcript, never estimated</text>
<text x="316" y="204" font-size="13.5" fill="#e6edf3" >• context window as the harness</text>
<text x="328" y="224" font-size="13.5" fill="#e6edf3" >states it</text>
<text x="316" y="244" font-size="13.5" fill="#e6edf3" >• stop and attach from CLI and</text>
<text x="328" y="264" font-size="13.5" fill="#e6edf3" >TUI</text>
<text x="316" y="284" font-size="13.5" fill="#e6edf3" >• viewers on a private pty; the</text>
<text x="328" y="304" font-size="13.5" fill="#e6edf3" >shell never shows between</text>
<text x="328" y="324" font-size="13.5" fill="#e6edf3" >transitions</text>
<text x="316" y="344" font-size="13.5" fill="#e6edf3" >• own terminal rows: a session</text>
<text x="328" y="364" font-size="13.5" fill="#e6edf3" >cones cannot join says so, no</text>
<text x="328" y="384" font-size="13.5" fill="#e6edf3" >stolen tty</text>
<text x="316" y="404" font-size="13.5" fill="#e6edf3" >• dashboard: grouping, filter</text>
<text x="316" y="424" font-size="13.5" fill="#e6edf3" >• menu: folder, jobs, config,</text>
<text x="328" y="444" font-size="13.5" fill="#e6edf3" >help</text>
<text x="316" y="464" font-size="13.5" fill="#e6edf3" >• composer: an instruction</text>
<text x="328" y="484" font-size="13.5" fill="#e6edf3" >starts a session in the</text>
<text x="328" y="504" font-size="13.5" fill="#e6edf3" >selected folder, any harness</text>
<text x="316" y="524" font-size="13.5" fill="#e6edf3" >• image paste into the composer</text>
<text x="316" y="544" font-size="13.5" fill="#e6edf3" >• a jobs screen behind the menu:</text>
<text x="328" y="564" font-size="13.5" fill="#e6edf3" >start, add, edit and delete</text>
<text x="328" y="584" font-size="13.5" fill="#e6edf3" >jobs there</text>
<text x="316" y="604" font-size="13.5" fill="#e6edf3" >• attach returns to the row;</text>
<text x="328" y="624" font-size="13.5" fill="#e6edf3" >ctrl+x stops</text>
<text x="582" y="64" font-size="13.5" fill="#e6edf3" >• ctrl+x removes a session with</text>
<text x="594" y="84" font-size="13.5" fill="#e6edf3" >claude rm, hides a finished</text>
<text x="594" y="104" font-size="13.5" fill="#e6edf3" >run</text>
<text x="582" y="124" font-size="13.5" fill="#e6edf3" >• states, keys and hints follow</text>
<text x="594" y="144" font-size="13.5" fill="#e6edf3" >claude agents</text>
<text x="582" y="164" font-size="13.5" fill="#e6edf3" >• per-harness marks, spinners,</text>
<text x="594" y="184" font-size="13.5" fill="#e6edf3" >colors</text>
<text x="582" y="204" font-size="13.5" fill="#e6edf3" >• doctor: login, job env,</text>
<text x="594" y="224" font-size="13.5" fill="#e6edf3" >version drift, flags</text>
<text x="582" y="244" font-size="13.5" fill="#e6edf3" >• cones coordinator start, skill</text>
<text x="594" y="264" font-size="13.5" fill="#e6edf3" >in the binary</text>
<text x="582" y="284" font-size="13.5" fill="#e6edf3" >• coordinator: two-way channel</text>
<text x="594" y="304" font-size="13.5" fill="#e6edf3" >to Codex agents</text>
<text x="582" y="324" font-size="13.5" fill="#e6edf3" >• viewers live inside the</text>
<text x="594" y="344" font-size="13.5" fill="#e6edf3" >dashboard; leaving and</text>
<text x="594" y="364" font-size="13.5" fill="#e6edf3" >returning is a focus change</text>
<text x="582" y="384" font-size="13.5" fill="#e6edf3" >• a fleet strip under a viewer;</text>
<text x="594" y="404" font-size="13.5" fill="#e6edf3" >ctrl+] cycles live viewers</text>
<text x="582" y="424" font-size="13.5" fill="#e6edf3" >• a session&#x27;s viewer opens while</text>
<text x="594" y="444" font-size="13.5" fill="#e6edf3" >the cursor rests on its row;</text>
<text x="594" y="464" font-size="13.5" fill="#e6edf3" >enter is instant</text>
<text x="582" y="484" font-size="13.5" fill="#e6edf3" >• the selected session shows</text>
<text x="594" y="504" font-size="13.5" fill="#e6edf3" >live beside the list, at any</text>
<text x="594" y="524" font-size="13.5" fill="#e6edf3" >terminal size</text>
<text x="582" y="544" font-size="13.5" fill="#e6edf3" >• the pane: on or off, right or</text>
<text x="594" y="564" font-size="13.5" fill="#e6edf3" >bottom, its own columns, all</text>
<text x="594" y="584" font-size="13.5" fill="#e6edf3" >from jobs.yaml</text>
<rect x="36" y="672" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="710" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="730" font-size="12.5" fill="#8b949e" >One dashboard, every harness</text>
<rect x="302" y="672" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="710" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="730" font-size="12.5" fill="#8b949e" >Everyday control of jobs</text>
<rect x="568" y="672" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="710" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="730" font-size="12.5" fill="#8b949e" >Needs a second harness or Mac</text>
<rect x="28" y="746" width="804" height="404" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="758" width="5" height="380" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="776" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">SEE</text>
<text x="50" y="808" font-size="16" fill="#30363d" >—</text>
<text x="316" y="808" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="832" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="854" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="876" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="898" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="920" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="942" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="984" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="1008" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="1030" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="1052" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="1074" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="1096" font-size="16" fill="#8b949e" >changed.</text>
<text x="582" y="808" font-size="17" fill="#e6edf3" font-weight="700">Fleet session records</text>
<text x="582" y="832" font-size="16" fill="#8b949e" >A session cones did not</text>
<text x="582" y="854" font-size="16" fill="#8b949e" >launch gets a ledger record</text>
<text x="582" y="876" font-size="16" fill="#8b949e" >when it leaves Claude&#x27;s</text>
<text x="582" y="898" font-size="16" fill="#8b949e" >registry: cwd, duration,</text>
<text x="582" y="920" font-size="16" fill="#8b949e" >tokens, dollars as last</text>
<text x="582" y="942" font-size="16" fill="#8b949e" >reported. ls totals it,</text>
<text x="582" y="964" font-size="16" fill="#8b949e" >daily_budget_usd ignores it.</text>
<text x="582" y="1006" font-size="17" fill="#e6edf3" font-weight="700">Touched files</text>
<text x="582" y="1030" font-size="16" fill="#8b949e" >Edit and Write paths read</text>
<text x="582" y="1052" font-size="16" fill="#8b949e" >from the session&#x27;s</text>
<text x="582" y="1074" font-size="16" fill="#8b949e" >transcript; ls --json shows</text>
<text x="582" y="1096" font-size="16" fill="#8b949e" >each footprint. Bash edits</text>
<text x="582" y="1118" font-size="16" fill="#8b949e" >are not seen.</text>
<rect x="28" y="1162" width="804" height="360" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1174" width="5" height="336" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1192" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">MOVE AND CONTROL</text>
<text x="50" y="1224" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1224" font-size="17" fill="#e6edf3" font-weight="700">Job lifecycle hooks</text>
<text x="316" y="1248" font-size="16" fill="#8b949e" >Opt-in commands on start,</text>
<text x="316" y="1270" font-size="16" fill="#8b949e" >exit and failure for jobs</text>
<text x="316" y="1292" font-size="16" fill="#8b949e" >cones launches, set in</text>
<text x="316" y="1314" font-size="16" fill="#8b949e" >jobs.yaml. Nothing hooks</text>
<text x="316" y="1336" font-size="16" fill="#8b949e" >sessions cones did not start.</text>
<text x="316" y="1378" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="316" y="1402" font-size="16" fill="#8b949e" >Enter on an own terminal row</text>
<text x="316" y="1424" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="316" y="1446" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="316" y="1468" font-size="16" fill="#8b949e" >the user there; the session</text>
<text x="316" y="1490" font-size="16" fill="#8b949e" >is never joined or stopped.</text>
<text x="582" y="1224" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="1534" width="804" height="668" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1546" width="5" height="644" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1564" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1596" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1596" font-size="16" fill="#30363d" >—</text>
<text x="582" y="1596" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1620" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1642" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1664" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1686" font-size="16" fill="#8b949e" >gates Codex jobs, not Codex</text>
<text x="582" y="1708" font-size="16" fill="#8b949e" >in the fleet.</text>
<text x="582" y="1750" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1774" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1796" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1818" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1860" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="582" y="1884" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="582" y="1906" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="582" y="1928" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="582" y="1950" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1992" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="2016" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="2038" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="2060" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="2102" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="2126" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="2148" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="2170" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="2214" width="804" height="382" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="2226" width="5" height="358" rx="2.5" fill="#f0883e"/>
<text x="46" y="2244" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="2276" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="2300" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="2322" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="2344" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="2366" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="2388" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="2276" font-size="17" fill="#e6edf3" font-weight="700">overlap: continue</text>
<text x="316" y="2300" font-size="16" fill="#8b949e" >A tick that finds the</text>
<text x="316" y="2322" font-size="16" fill="#8b949e" >previous run still going</text>
<text x="316" y="2344" font-size="16" fill="#8b949e" >stops it and starts the new</text>
<text x="316" y="2366" font-size="16" fill="#8b949e" >run with claude --resume on</text>
<text x="316" y="2388" font-size="16" fill="#8b949e" >run 1&#x27;s session id, so run 2</text>
<text x="316" y="2410" font-size="16" fill="#8b949e" >keeps what run 1 learned.</text>
<text x="316" y="2452" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="2476" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="2498" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="2520" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="2542" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="2564" font-size="16" fill="#8b949e" >into the README.</text>
<text x="582" y="2276" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="582" y="2300" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="582" y="2322" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="582" y="2344" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="2386" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2410" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2432" font-size="16" fill="#8b949e" >worktree. Recipe from claude-</text>
<text x="582" y="2454" font-size="16" fill="#8b949e" >squad, ported as git</text>
<text x="582" y="2476" font-size="16" fill="#8b949e" >commands. Only if shared</text>
<text x="582" y="2498" font-size="16" fill="#8b949e" >directories prove</text>
<text x="582" y="2520" font-size="16" fill="#8b949e" >insufficient.</text>
<text x="28" y="2622" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets and the ledger. The harness owns execution and</text>
<text x="28" y="2642" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
<text x="28" y="2662" font-size="14" fill="#8b949e" >Seeing a harness&#x27;s sessions never waits on enforcing its budgets.</text>
</svg>