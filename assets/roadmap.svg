<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2330" viewBox="0 0 860 2330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2330" fill="#0d1117"/>
<text x="28" y="62" font-size="32" fill="#e6edf3" font-weight="700">cones roadmap</text>
<text x="28" y="92" font-size="16" fill="#8b949e" >Scheduled coding-agent jobs on your Mac, under explicit policy, with every run accounted for.</text>
<rect x="28" y="112" width="804" height="178" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="136" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0-headless</text>
<text x="44" y="160" font-size="15" fill="#e6edf3" >Claude jobs on a launchd schedule · dollar budget, timeout, turn cap · read-only or sandboxed-</text>
<text x="44" y="182" font-size="15" fill="#e6edf3" >write policy · rolling daily budget · live event stream · terminal dashboard · stop, list,</text>
<text x="44" y="204" font-size="15" fill="#e6edf3" >resume in Claude&#x27;s TUI · overlap skip / allow / replace · shared-workspace writer lock · cones</text>
<text x="44" y="226" font-size="15" fill="#e6edf3" >lock around any command · opt-in failure notification · global Claude fleet hook: one state file</text>
<text x="44" y="248" font-size="15" fill="#e6edf3" >per session · fleet view: every Claude session in ls and the dashboard grouped by directory with</text>
<text x="44" y="270" font-size="15" fill="#e6edf3" >title, state, age, tokens and last message · durable run ledger</text>
<rect x="36" y="316" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="354" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="374" font-size="12.5" fill="#8b949e" >Make the first release trustworthy</text>
<rect x="302" y="316" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="354" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="374" font-size="12.5" fill="#8b949e" >More harnesses, less manual follow-up</text>
<rect x="568" y="316" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="354" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="374" font-size="12.5" fill="#8b949e" >From scheduler to fleet control</text>
<rect x="28" y="390" width="804" height="602" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="402" width="5" height="578" rx="2.5" fill="#f0883e"/>
<text x="46" y="420" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="452" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="50" y="476" font-size="16" fill="#8b949e" >launchd catch-up after lid-</text>
<text x="50" y="498" font-size="16" fill="#8b949e" >close and reboot verified;</text>
<text x="50" y="520" font-size="16" fill="#8b949e" >what replays and what is</text>
<text x="50" y="542" font-size="16" fill="#8b949e" >lost, documented.</text>
<text x="50" y="584" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="608" font-size="16" fill="#8b949e" >Install steps and</text>
<text x="50" y="630" font-size="16" fill="#8b949e" >verification record,</text>
<text x="50" y="652" font-size="16" fill="#8b949e" >published under the personal</text>
<text x="50" y="674" font-size="16" fill="#8b949e" >account.</text>
<text x="50" y="716" font-size="17" fill="#e6edf3" font-weight="700">Doctor covers auth</text>
<text x="50" y="740" font-size="16" fill="#8b949e" >cones doctor verifies Claude</text>
<text x="50" y="762" font-size="16" fill="#8b949e" >login and every env var a job</text>
<text x="50" y="784" font-size="16" fill="#8b949e" >imports, so a scheduled run</text>
<text x="50" y="806" font-size="16" fill="#8b949e" >does not fail on missing</text>
<text x="50" y="828" font-size="16" fill="#8b949e" >credentials.</text>
<text x="50" y="870" font-size="17" fill="#e6edf3" font-weight="700">Drop dead weight</text>
<text x="50" y="894" font-size="16" fill="#8b949e" >Remove the agent-console</text>
<text x="50" y="916" font-size="16" fill="#8b949e" >control plane stub,</text>
<text x="50" y="938" font-size="16" fill="#8b949e" >config.toml, Pi, and three</text>
<text x="50" y="960" font-size="16" fill="#8b949e" >unused dependencies.</text>
<text x="316" y="452" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="316" y="476" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="316" y="498" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="316" y="520" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="452" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="1004" width="804" height="316" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1016" width="5" height="292" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="1034" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text>
<text x="50" y="1066" font-size="17" fill="#e6edf3" font-weight="700">Run summary in ls</text>
<text x="50" y="1090" font-size="16" fill="#8b949e" >One line per run: what it</text>
<text x="50" y="1112" font-size="16" fill="#8b949e" >did, cost, why it stopped.</text>
<text x="50" y="1154" font-size="17" fill="#e6edf3" font-weight="700">Live working glyph</text>
<text x="50" y="1178" font-size="16" fill="#8b949e" >The dashboard&#x27;s working cone</text>
<text x="50" y="1200" font-size="16" fill="#8b949e" >animates like Claude Code&#x27;s</text>
<text x="50" y="1222" font-size="16" fill="#8b949e" >spinner and rows refresh on a</text>
<text x="50" y="1244" font-size="16" fill="#8b949e" >timer, not only on a</text>
<text x="50" y="1266" font-size="16" fill="#8b949e" >keypress. Pixel-art cone</text>
<text x="50" y="1288" font-size="16" fill="#8b949e" >theme throughout.</text>
<text x="316" y="1066" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="1090" font-size="16" fill="#8b949e" >See what runs next, not only</text>
<text x="316" y="1112" font-size="16" fill="#8b949e" >what already ran.</text>
<text x="316" y="1154" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="1178" font-size="16" fill="#8b949e" >The working-tree change a run</text>
<text x="316" y="1200" font-size="16" fill="#8b949e" >produced, from the ledger.</text>
<text x="582" y="1066" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="582" y="1090" font-size="16" fill="#8b949e" >Hook-derived</text>
<text x="582" y="1112" font-size="16" fill="#8b949e" >blocked/idle/exited ship in</text>
<text x="582" y="1134" font-size="16" fill="#8b949e" >Now; agent-declared started,</text>
<text x="582" y="1156" font-size="16" fill="#8b949e" >milestone, done come here.</text>
<rect x="28" y="1332" width="804" height="360" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1344" width="5" height="336" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1362" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1394" font-size="17" fill="#e6edf3" font-weight="700">Harness compatibility check</text>
<text x="50" y="1418" font-size="16" fill="#8b949e" >cones doctor compares the</text>
<text x="50" y="1440" font-size="16" fill="#8b949e" >installed Claude version and</text>
<text x="50" y="1462" font-size="16" fill="#8b949e" >the flags cones compiles to</text>
<text x="50" y="1484" font-size="16" fill="#8b949e" >against the tested set, and</text>
<text x="50" y="1506" font-size="16" fill="#8b949e" >reports drift before install.</text>
<text x="50" y="1548" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="50" y="1572" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="50" y="1594" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="50" y="1616" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="50" y="1638" font-size="16" fill="#8b949e" >gates the Codex adapter.</text>
<text x="316" y="1394" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="316" y="1418" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="316" y="1440" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="316" y="1462" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="316" y="1504" font-size="17" fill="#e6edf3" font-weight="700">Codex fleet hooks</text>
<text x="316" y="1528" font-size="16" fill="#8b949e" >cones hook codex, once Codex</text>
<text x="316" y="1550" font-size="16" fill="#8b949e" >hook trust can be configured</text>
<text x="316" y="1572" font-size="16" fill="#8b949e" >without a bypass flag.</text>
<text x="316" y="1614" font-size="17" fill="#e6edf3" font-weight="700">File and webhook triggers</text>
<text x="316" y="1638" font-size="16" fill="#8b949e" >Run on path change or HTTP</text>
<text x="316" y="1660" font-size="16" fill="#8b949e" >call, not only on a calendar.</text>
<text x="582" y="1394" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="1418" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="1440" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="1462" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="1704" width="804" height="536" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1716" width="5" height="512" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1734" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">COORDINATION</text>
<text x="50" y="1766" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1766" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="316" y="1790" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="316" y="1812" font-size="16" fill="#8b949e" >worktree; unlocks overlap:</text>
<text x="316" y="1834" font-size="16" fill="#8b949e" >allow for write jobs. Recipe</text>
<text x="316" y="1856" font-size="16" fill="#8b949e" >from claude-squad, ported as</text>
<text x="316" y="1878" font-size="16" fill="#8b949e" >git commands.</text>
<text x="582" y="1766" font-size="17" fill="#e6edf3" font-weight="700">Fleet roster</text>
<text x="582" y="1790" font-size="16" fill="#8b949e" >Task and declared file scope</text>
<text x="582" y="1812" font-size="16" fill="#8b949e" >added to each session&#x27;s state</text>
<text x="582" y="1834" font-size="16" fill="#8b949e" >file; overlaps detected</text>
<text x="582" y="1856" font-size="16" fill="#8b949e" >before commit. Only when two</text>
<text x="582" y="1878" font-size="16" fill="#8b949e" >writers share a repo.</text>
<text x="582" y="1920" font-size="17" fill="#e6edf3" font-weight="700">Commit lock and queue</text>
<text x="582" y="1944" font-size="16" fill="#8b949e" >Agents acquire a per-repo</text>
<text x="582" y="1966" font-size="16" fill="#8b949e" >lock before committing; cones</text>
<text x="582" y="1988" font-size="16" fill="#8b949e" >grants in order. Workers</text>
<text x="582" y="2010" font-size="16" fill="#8b949e" >never push or stash.</text>
<text x="582" y="2052" font-size="17" fill="#e6edf3" font-weight="700">Coordinator token</text>
<text x="582" y="2076" font-size="16" fill="#8b949e" >Coordinator messages carry a</text>
<text x="582" y="2098" font-size="16" fill="#8b949e" >per-run token; workers ignore</text>
<text x="582" y="2120" font-size="16" fill="#8b949e" >messages without it.</text>
<text x="582" y="2162" font-size="17" fill="#e6edf3" font-weight="700">Standing orders</text>
<text x="582" y="2186" font-size="16" fill="#8b949e" >Fleet rules as data, checked</text>
<text x="582" y="2208" font-size="16" fill="#8b949e" >when the last job ends.</text>
<text x="28" y="2266" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and</text>
<text x="28" y="2286" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
</svg>