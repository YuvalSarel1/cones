<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2622" viewBox="0 0 860 2622" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2622" fill="#0d1117"/>
<rect x="28" y="16" width="804" height="370" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="40" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="50" y="64" font-size="13.5" fill="#e6edf3" >• launchd schedule, no daemon</text>
<text x="62" y="84" font-size="13.5" fill="#e6edf3" >between ticks</text>
<text x="50" y="104" font-size="13.5" fill="#e6edf3" >• dollar budget, timeout, turn</text>
<text x="62" y="124" font-size="13.5" fill="#e6edf3" >cap</text>
<text x="50" y="144" font-size="13.5" fill="#e6edf3" >• rolling daily budget</text>
<text x="50" y="164" font-size="13.5" fill="#e6edf3" >• read-only or sandboxed-write</text>
<text x="62" y="184" font-size="13.5" fill="#e6edf3" >policy</text>
<text x="50" y="204" font-size="13.5" fill="#e6edf3" >• overlap skip / allow / replace</text>
<text x="50" y="224" font-size="13.5" fill="#e6edf3" >• one-off runs: cones run</text>
<text x="62" y="244" font-size="13.5" fill="#e6edf3" >--prompt</text>
<text x="50" y="264" font-size="13.5" fill="#e6edf3" >• opt-in failure notification</text>
<text x="50" y="284" font-size="13.5" fill="#e6edf3" >• durable JSONL run ledger</text>
<text x="316" y="64" font-size="13.5" fill="#e6edf3" >• dollars per run in ls and the</text>
<text x="328" y="84" font-size="13.5" fill="#e6edf3" >ledger</text>
<text x="316" y="104" font-size="13.5" fill="#e6edf3" >• live event stream</text>
<text x="316" y="124" font-size="13.5" fill="#e6edf3" >• fleet from Claude&#x27;s own</text>
<text x="328" y="144" font-size="13.5" fill="#e6edf3" >session registry, no hook</text>
<text x="316" y="164" font-size="13.5" fill="#e6edf3" >• every Claude session in ls and</text>
<text x="328" y="184" font-size="13.5" fill="#e6edf3" >the TUI</text>
<text x="316" y="204" font-size="13.5" fill="#e6edf3" >• Codex sessions from the</text>
<text x="328" y="224" font-size="13.5" fill="#e6edf3" >process table and rollout file</text>
<text x="316" y="244" font-size="13.5" fill="#e6edf3" >• model, start, activity and</text>
<text x="328" y="264" font-size="13.5" fill="#e6edf3" >context read from the</text>
<text x="328" y="284" font-size="13.5" fill="#e6edf3" >transcript, never estimated</text>
<text x="316" y="304" font-size="13.5" fill="#e6edf3" >• stop and attach from CLI and</text>
<text x="328" y="324" font-size="13.5" fill="#e6edf3" >TUI</text>
<text x="316" y="344" font-size="13.5" fill="#e6edf3" >• dashboard: details pane,</text>
<text x="328" y="364" font-size="13.5" fill="#e6edf3" >dispatch, grouping</text>
<text x="582" y="64" font-size="13.5" fill="#e6edf3" >• n launches in any folder,</text>
<text x="594" y="84" font-size="13.5" fill="#e6edf3" >interactive or managed</text>
<text x="582" y="104" font-size="13.5" fill="#e6edf3" >• tab reads more of a session,</text>
<text x="594" y="124" font-size="13.5" fill="#e6edf3" >attach returns to the row</text>
<text x="582" y="144" font-size="13.5" fill="#e6edf3" >• key hints follow claude agents</text>
<text x="582" y="164" font-size="13.5" fill="#e6edf3" >• per-harness marks, spinners,</text>
<text x="594" y="184" font-size="13.5" fill="#e6edf3" >colors</text>
<text x="582" y="204" font-size="13.5" fill="#e6edf3" >• doctor: login, job env,</text>
<text x="594" y="224" font-size="13.5" fill="#e6edf3" >version drift, flags</text>
<text x="582" y="244" font-size="13.5" fill="#e6edf3" >• cones coordinator start, skill</text>
<text x="594" y="264" font-size="13.5" fill="#e6edf3" >in the binary</text>
<rect x="36" y="412" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="450" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="470" font-size="12.5" fill="#8b949e" >One dashboard, every harness</text>
<rect x="302" y="412" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="450" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="470" font-size="12.5" fill="#8b949e" >Everyday control of jobs</text>
<rect x="568" y="412" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="450" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="470" font-size="12.5" fill="#8b949e" >Needs a second harness or Mac</text>
<rect x="28" y="486" width="804" height="734" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="498" width="5" height="710" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="516" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">SEE</text>
<text x="50" y="548" font-size="16" fill="#30363d" >—</text>
<text x="316" y="548" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="572" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="594" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="616" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="638" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="660" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="682" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="724" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="748" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="770" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="792" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="814" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="836" font-size="16" fill="#8b949e" >changed.</text>
<text x="316" y="878" font-size="17" fill="#e6edf3" font-weight="700">Touched files</text>
<text x="316" y="902" font-size="16" fill="#8b949e" >Edit and Write paths read</text>
<text x="316" y="924" font-size="16" fill="#8b949e" >from the session&#x27;s</text>
<text x="316" y="946" font-size="16" fill="#8b949e" >transcript; ls --json and the</text>
<text x="316" y="968" font-size="16" fill="#8b949e" >details pane show each</text>
<text x="316" y="990" font-size="16" fill="#8b949e" >footprint. Bash edits are not</text>
<text x="316" y="1012" font-size="16" fill="#8b949e" >seen.</text>
<text x="316" y="1054" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="316" y="1078" font-size="16" fill="#8b949e" >cones status &#x27;text&#x27; records a</text>
<text x="316" y="1100" font-size="16" fill="#8b949e" >one-line check-in per session</text>
<text x="316" y="1122" font-size="16" fill="#8b949e" >that fills the last column,</text>
<text x="316" y="1144" font-size="16" fill="#8b949e" >kept apart from the</text>
<text x="316" y="1166" font-size="16" fill="#8b949e" >active/idle/blocked state</text>
<text x="316" y="1188" font-size="16" fill="#8b949e" >Claude reports.</text>
<text x="582" y="548" font-size="17" fill="#e6edf3" font-weight="700">Fleet session records</text>
<text x="582" y="572" font-size="16" fill="#8b949e" >A session cones did not</text>
<text x="582" y="594" font-size="16" fill="#8b949e" >launch gets a ledger record</text>
<text x="582" y="616" font-size="16" fill="#8b949e" >when it leaves Claude&#x27;s</text>
<text x="582" y="638" font-size="16" fill="#8b949e" >registry: cwd, duration,</text>
<text x="582" y="660" font-size="16" fill="#8b949e" >tokens, dollars as last</text>
<text x="582" y="682" font-size="16" fill="#8b949e" >reported. ls totals it,</text>
<text x="582" y="704" font-size="16" fill="#8b949e" >daily_budget_usd ignores it.</text>
<rect x="28" y="1232" width="804" height="206" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1244" width="5" height="182" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1262" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">MOVE AND CONTROL</text>
<text x="50" y="1294" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1294" font-size="17" fill="#e6edf3" font-weight="700">Job lifecycle hooks</text>
<text x="316" y="1318" font-size="16" fill="#8b949e" >Opt-in commands on start,</text>
<text x="316" y="1340" font-size="16" fill="#8b949e" >exit and failure for jobs</text>
<text x="316" y="1362" font-size="16" fill="#8b949e" >cones launches, set in</text>
<text x="316" y="1384" font-size="16" fill="#8b949e" >jobs.yaml. Nothing hooks</text>
<text x="316" y="1406" font-size="16" fill="#8b949e" >sessions cones did not start.</text>
<text x="582" y="1294" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="582" y="1318" font-size="16" fill="#8b949e" >Enter on a foreign session</text>
<text x="582" y="1340" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="582" y="1362" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="582" y="1384" font-size="16" fill="#8b949e" >there, instead of resuming a</text>
<text x="582" y="1406" font-size="16" fill="#8b949e" >copy.</text>
<rect x="28" y="1450" width="804" height="668" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1462" width="5" height="644" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1480" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1512" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1512" font-size="16" fill="#30363d" >—</text>
<text x="582" y="1512" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1536" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1558" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1580" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1602" font-size="16" fill="#8b949e" >gates Codex jobs, not Codex</text>
<text x="582" y="1624" font-size="16" fill="#8b949e" >in the fleet.</text>
<text x="582" y="1666" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1690" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1712" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1734" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1776" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="582" y="1800" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="582" y="1822" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="582" y="1844" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="582" y="1866" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1908" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="1932" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="1954" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="1976" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="2018" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="2042" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="2064" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="2086" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="2130" width="804" height="382" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="2142" width="5" height="358" rx="2.5" fill="#f0883e"/>
<text x="46" y="2160" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="2192" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="2216" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="2238" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="2260" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="2282" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="2304" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="2192" font-size="17" fill="#e6edf3" font-weight="700">overlap: continue</text>
<text x="316" y="2216" font-size="16" fill="#8b949e" >A tick that finds the</text>
<text x="316" y="2238" font-size="16" fill="#8b949e" >previous run still going</text>
<text x="316" y="2260" font-size="16" fill="#8b949e" >stops it and starts the new</text>
<text x="316" y="2282" font-size="16" fill="#8b949e" >run with claude --resume on</text>
<text x="316" y="2304" font-size="16" fill="#8b949e" >run 1&#x27;s session id, so run 2</text>
<text x="316" y="2326" font-size="16" fill="#8b949e" >keeps what run 1 learned.</text>
<text x="316" y="2368" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="2392" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="2414" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="2436" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="2458" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="2480" font-size="16" fill="#8b949e" >into the README.</text>
<text x="582" y="2192" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="582" y="2216" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="582" y="2238" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="582" y="2260" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="2302" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2326" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2348" font-size="16" fill="#8b949e" >worktree. Recipe from claude-</text>
<text x="582" y="2370" font-size="16" fill="#8b949e" >squad, ported as git</text>
<text x="582" y="2392" font-size="16" fill="#8b949e" >commands. Only if shared</text>
<text x="582" y="2414" font-size="16" fill="#8b949e" >directories prove</text>
<text x="582" y="2436" font-size="16" fill="#8b949e" >insufficient.</text>
<text x="28" y="2538" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets and the ledger. The harness owns execution and</text>
<text x="28" y="2558" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
<text x="28" y="2578" font-size="14" fill="#8b949e" >Seeing a harness&#x27;s sessions never waits on enforcing its budgets.</text>
</svg>