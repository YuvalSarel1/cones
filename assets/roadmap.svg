<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2432" viewBox="0 0 860 2432" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2432" fill="#0d1117"/>
<rect x="28" y="16" width="804" height="310" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="40" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="50" y="64" font-size="13.5" fill="#e6edf3" >• launchd schedule, no daemon</text>
<text x="62" y="84" font-size="13.5" fill="#e6edf3" >between ticks</text>
<text x="50" y="104" font-size="13.5" fill="#e6edf3" >• dollar budget, timeout, turn</text>
<text x="62" y="124" font-size="13.5" fill="#e6edf3" >cap</text>
<text x="50" y="144" font-size="13.5" fill="#e6edf3" >• rolling daily budget</text>
<text x="50" y="164" font-size="13.5" fill="#e6edf3" >• read-only or sandboxed-write</text>
<text x="62" y="184" font-size="13.5" fill="#e6edf3" >policy</text>
<text x="50" y="204" font-size="13.5" fill="#e6edf3" >• overlap skip / allow / replace</text>
<text x="50" y="224" font-size="13.5" fill="#e6edf3" >• one-off runs: cones run</text>
<text x="62" y="244" font-size="13.5" fill="#e6edf3" >--prompt</text>
<text x="50" y="264" font-size="13.5" fill="#e6edf3" >• shared-workspace writer lock</text>
<text x="316" y="64" font-size="13.5" fill="#e6edf3" >• cones lock around any command</text>
<text x="316" y="84" font-size="13.5" fill="#e6edf3" >• opt-in failure notification</text>
<text x="316" y="104" font-size="13.5" fill="#e6edf3" >• durable JSONL run ledger</text>
<text x="316" y="124" font-size="13.5" fill="#e6edf3" >• dollars per run in ls and the</text>
<text x="328" y="144" font-size="13.5" fill="#e6edf3" >ledger</text>
<text x="316" y="164" font-size="13.5" fill="#e6edf3" >• live event stream</text>
<text x="316" y="184" font-size="13.5" fill="#e6edf3" >• global fleet hook, one file</text>
<text x="328" y="204" font-size="13.5" fill="#e6edf3" >per session</text>
<text x="316" y="224" font-size="13.5" fill="#e6edf3" >• every Claude session in ls and</text>
<text x="328" y="244" font-size="13.5" fill="#e6edf3" >the TUI</text>
<text x="582" y="64" font-size="13.5" fill="#e6edf3" >• stop and attach from CLI and</text>
<text x="594" y="84" font-size="13.5" fill="#e6edf3" >TUI</text>
<text x="582" y="104" font-size="13.5" fill="#e6edf3" >• fleet status from claude</text>
<text x="594" y="124" font-size="13.5" fill="#e6edf3" >agents --json</text>
<text x="582" y="144" font-size="13.5" fill="#e6edf3" >• dashboard: details pane,</text>
<text x="594" y="164" font-size="13.5" fill="#e6edf3" >dispatch, grouping</text>
<text x="582" y="184" font-size="13.5" fill="#e6edf3" >• key hints follow claude agents</text>
<text x="582" y="204" font-size="13.5" fill="#e6edf3" >• per-harness marks, spinners,</text>
<text x="594" y="224" font-size="13.5" fill="#e6edf3" >colors</text>
<text x="582" y="244" font-size="13.5" fill="#e6edf3" >• doctor: login, job env,</text>
<text x="594" y="264" font-size="13.5" fill="#e6edf3" >version drift, flags</text>
<text x="582" y="284" font-size="13.5" fill="#e6edf3" >• cones coordinator start, skill</text>
<text x="594" y="304" font-size="13.5" fill="#e6edf3" >in the binary</text>
<rect x="36" y="352" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="390" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="410" font-size="12.5" fill="#8b949e" >What the coordinator needs from cones</text>
<rect x="302" y="352" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="390" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="410" font-size="12.5" fill="#8b949e" >Claude only, no second writer needed</text>
<rect x="568" y="352" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="390" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="410" font-size="12.5" fill="#8b949e" >Needs a second writer, harness or Mac</text>
<rect x="28" y="426" width="804" height="316" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="438" width="5" height="292" rx="2.5" fill="#f0883e"/>
<text x="46" y="456" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="488" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="512" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="534" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="556" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="578" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="600" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="488" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="512" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="534" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="556" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="578" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="600" font-size="16" fill="#8b949e" >into the README.</text>
<text x="316" y="642" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="316" y="666" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="316" y="688" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="316" y="710" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="488" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="754" width="804" height="558" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="766" width="5" height="534" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="784" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text>
<text x="50" y="816" font-size="17" fill="#e6edf3" font-weight="700">Touched files from hooks</text>
<text x="50" y="840" font-size="16" fill="#8b949e" >PostToolUse Edit and Write</text>
<text x="50" y="862" font-size="16" fill="#8b949e" >paths accumulate in the</text>
<text x="50" y="884" font-size="16" fill="#8b949e" >session&#x27;s fleet file; ls</text>
<text x="50" y="906" font-size="16" fill="#8b949e" >--json and the details pane</text>
<text x="50" y="928" font-size="16" fill="#8b949e" >show each footprint. Bash</text>
<text x="50" y="950" font-size="16" fill="#8b949e" >edits are not seen.</text>
<text x="50" y="992" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="50" y="1016" font-size="16" fill="#8b949e" >cones status &#x27;text&#x27; writes</text>
<text x="50" y="1038" font-size="16" fill="#8b949e" >the session&#x27;s fleet file and</text>
<text x="50" y="1060" font-size="16" fill="#8b949e" >fills the last column, so the</text>
<text x="50" y="1082" font-size="16" fill="#8b949e" >orchestrator reads check-ins</text>
<text x="50" y="1104" font-size="16" fill="#8b949e" >instead of asking; hook-</text>
<text x="50" y="1126" font-size="16" fill="#8b949e" >derived blocked/idle/exited</text>
<text x="50" y="1148" font-size="16" fill="#8b949e" >shipped.</text>
<text x="316" y="816" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="840" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="862" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="884" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="906" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="928" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="950" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="992" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="1016" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="1038" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="1060" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="1082" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="1104" font-size="16" fill="#8b949e" >changed.</text>
<text x="316" y="1146" font-size="17" fill="#e6edf3" font-weight="700">Fleet sessions in the ledger</text>
<text x="316" y="1170" font-size="16" fill="#8b949e" >SessionEnd writes a session</text>
<text x="316" y="1192" font-size="16" fill="#8b949e" >record (cwd, duration,</text>
<text x="316" y="1214" font-size="16" fill="#8b949e" >tokens, dollars) for sessions</text>
<text x="316" y="1236" font-size="16" fill="#8b949e" >cones did not launch; ls</text>
<text x="316" y="1258" font-size="16" fill="#8b949e" >totals it, daily_budget_usd</text>
<text x="316" y="1280" font-size="16" fill="#8b949e" >ignores it.</text>
<text x="582" y="816" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="582" y="840" font-size="16" fill="#8b949e" >Enter on a foreign session</text>
<text x="582" y="862" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="582" y="884" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="582" y="906" font-size="16" fill="#8b949e" >there, instead of resuming a</text>
<text x="582" y="928" font-size="16" fill="#8b949e" >copy.</text>
<rect x="28" y="1324" width="804" height="624" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1336" width="5" height="600" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1354" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1386" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1386" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="316" y="1410" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="316" y="1432" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="316" y="1454" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="316" y="1476" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1386" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1410" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1432" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1454" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1476" font-size="16" fill="#8b949e" >gates the Codex adapter.</text>
<text x="582" y="1518" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1542" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1564" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1586" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1628" font-size="17" fill="#e6edf3" font-weight="700">Codex fleet hooks</text>
<text x="582" y="1652" font-size="16" fill="#8b949e" >cones hook codex, once Codex</text>
<text x="582" y="1674" font-size="16" fill="#8b949e" >hook trust can be configured</text>
<text x="582" y="1696" font-size="16" fill="#8b949e" >without a bypass flag.</text>
<text x="582" y="1738" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="1762" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="1784" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="1806" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="1848" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="1872" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="1894" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="1916" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="1960" width="804" height="382" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1972" width="5" height="358" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1990" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">COORDINATION</text>
<text x="50" y="2022" font-size="17" fill="#e6edf3" font-weight="700">Lock holder in ls</text>
<text x="50" y="2046" font-size="16" fill="#8b949e" >Holder pid and session id</text>
<text x="50" y="2068" font-size="16" fill="#8b949e" >land beside the .lock; ls,</text>
<text x="50" y="2090" font-size="16" fill="#8b949e" >the dashboard and cones lock</text>
<text x="50" y="2112" font-size="16" fill="#8b949e" >--status show who holds and</text>
<text x="50" y="2134" font-size="16" fill="#8b949e" >who waits; --try exits 1, no</text>
<text x="50" y="2156" font-size="16" fill="#8b949e" >waiting.</text>
<text x="316" y="2022" font-size="17" fill="#e6edf3" font-weight="700">Other coordinators</text>
<text x="316" y="2046" font-size="16" fill="#8b949e" >cones coordinator start</text>
<text x="316" y="2068" font-size="16" fill="#8b949e" >--skill NAME launches any</text>
<text x="316" y="2090" font-size="16" fill="#8b949e" >coordinator skill, Claude</text>
<text x="316" y="2112" font-size="16" fill="#8b949e" >Code or another harness;</text>
<text x="316" y="2134" font-size="16" fill="#8b949e" >start-orchestrator stays the</text>
<text x="316" y="2156" font-size="16" fill="#8b949e" >default.</text>
<text x="582" y="2022" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2046" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2068" font-size="16" fill="#8b949e" >worktree; unlocks overlap:</text>
<text x="582" y="2090" font-size="16" fill="#8b949e" >allow for write jobs. Recipe</text>
<text x="582" y="2112" font-size="16" fill="#8b949e" >from claude-squad, ported as</text>
<text x="582" y="2134" font-size="16" fill="#8b949e" >git commands.</text>
<text x="582" y="2176" font-size="17" fill="#e6edf3" font-weight="700">Cross-harness coordination</text>
<text x="582" y="2200" font-size="16" fill="#8b949e" >The coordinator drives Claude</text>
<text x="582" y="2222" font-size="16" fill="#8b949e" >Code and Codex agents in one</text>
<text x="582" y="2244" font-size="16" fill="#8b949e" >folder alike: Codex arrivals</text>
<text x="582" y="2266" font-size="16" fill="#8b949e" >greeted, gated and relayed,</text>
<text x="582" y="2288" font-size="16" fill="#8b949e" >not only read from their</text>
<text x="582" y="2310" font-size="16" fill="#8b949e" >rollout files.</text>
<text x="28" y="2368" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and</text>
<text x="28" y="2388" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
</svg>