<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2638" viewBox="0 0 860 2638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2638" fill="#0d1117"/>
<text x="28" y="62" font-size="32" fill="#e6edf3" font-weight="700">cones roadmap</text>
<text x="28" y="92" font-size="16" fill="#8b949e" >Scheduled coding-agent jobs on your Mac, under explicit policy, with every run accounted for.</text>
<rect x="28" y="112" width="804" height="420" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="136" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="44" y="160" font-size="15" fill="#e6edf3" >Claude jobs on a launchd schedule · dollar budget, timeout, turn cap · read-only or sandboxed-</text>
<text x="44" y="182" font-size="15" fill="#e6edf3" >write policy · rolling daily budget · live event stream · native dashboard: live refresh,</text>
<text x="44" y="204" font-size="15" fill="#e6edf3" >animated cone, details pane, dispatch prompt, group by state or directory · one-off tasks with</text>
<text x="44" y="226" font-size="15" fill="#e6edf3" >cones run --prompt · stop, list, resume in Claude&#x27;s TUI · overlap skip / allow / replace ·</text>
<text x="44" y="248" font-size="15" fill="#e6edf3" >shared-workspace writer lock · cones lock around any command, git commit included · opt-in</text>
<text x="44" y="270" font-size="15" fill="#e6edf3" >failure notification · global Claude fleet hook: one state file per session · fleet view: every</text>
<text x="44" y="292" font-size="15" fill="#e6edf3" >Claude session in ls and the dashboard grouped by directory with title, state, age, tokens and</text>
<text x="44" y="314" font-size="15" fill="#e6edf3" >last message · stop for fleet sessions from the CLI and the dashboard · key hints follow claude</text>
<text x="44" y="336" font-size="15" fill="#e6edf3" >agents, ctrl-x twice stops · per-harness marks, spinners and colors · enter opens a live session</text>
<text x="44" y="358" font-size="15" fill="#e6edf3" >in this terminal through claude attach, follows a running run, resumes a finished one; cones</text>
<text x="44" y="380" font-size="15" fill="#e6edf3" >logs takes a session id · details pane shows the last prompt and full reply · durable run ledger</text>
<text x="44" y="402" font-size="15" fill="#e6edf3" >· agent-console stub, config.toml and Pi jobs dropped with the three dependencies only they used</text>
<text x="44" y="424" font-size="15" fill="#e6edf3" >· doctor fails on missing login or job env, warns on Claude version drift, probes the flags the</text>
<text x="44" y="446" font-size="15" fill="#e6edf3" >compiler emits · run rows and cones ls show dollars spent from the ledger · claude agents --json</text>
<text x="44" y="468" font-size="15" fill="#e6edf3" >and the job state file feed the fleet view, last column reads Claude&#x27;s own status · cones</text>
<text x="44" y="490" font-size="15" fill="#e6edf3" >coordinator start: one start-orchestrator session per folder, the skill ships inside the binary</text>
<text x="44" y="512" font-size="15" fill="#e6edf3" >as a per-session plugin</text>
<rect x="36" y="558" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="596" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="616" font-size="12.5" fill="#8b949e" >What the coordinator needs from cones</text>
<rect x="302" y="558" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="596" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="616" font-size="12.5" fill="#8b949e" >Claude only, no second writer needed</text>
<rect x="568" y="558" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="596" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="616" font-size="12.5" fill="#8b949e" >Needs a second writer, harness or Mac</text>
<rect x="28" y="632" width="804" height="316" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="644" width="5" height="292" rx="2.5" fill="#f0883e"/>
<text x="46" y="662" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="694" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="718" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="740" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="762" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="784" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="806" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="694" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="718" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="740" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="762" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="784" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="806" font-size="16" fill="#8b949e" >into the README.</text>
<text x="316" y="848" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="316" y="872" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="316" y="894" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="316" y="916" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="694" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="960" width="804" height="558" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="972" width="5" height="534" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="990" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text>
<text x="50" y="1022" font-size="17" fill="#e6edf3" font-weight="700">Touched files from hooks</text>
<text x="50" y="1046" font-size="16" fill="#8b949e" >PostToolUse Edit and Write</text>
<text x="50" y="1068" font-size="16" fill="#8b949e" >paths accumulate in the</text>
<text x="50" y="1090" font-size="16" fill="#8b949e" >session&#x27;s fleet file; ls</text>
<text x="50" y="1112" font-size="16" fill="#8b949e" >--json and the details pane</text>
<text x="50" y="1134" font-size="16" fill="#8b949e" >show each footprint. Bash</text>
<text x="50" y="1156" font-size="16" fill="#8b949e" >edits are not seen.</text>
<text x="50" y="1198" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="50" y="1222" font-size="16" fill="#8b949e" >cones status &#x27;text&#x27; writes</text>
<text x="50" y="1244" font-size="16" fill="#8b949e" >the session&#x27;s fleet file and</text>
<text x="50" y="1266" font-size="16" fill="#8b949e" >fills the last column, so the</text>
<text x="50" y="1288" font-size="16" fill="#8b949e" >orchestrator reads check-ins</text>
<text x="50" y="1310" font-size="16" fill="#8b949e" >instead of asking; hook-</text>
<text x="50" y="1332" font-size="16" fill="#8b949e" >derived blocked/idle/exited</text>
<text x="50" y="1354" font-size="16" fill="#8b949e" >shipped.</text>
<text x="316" y="1022" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="1046" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="1068" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="1090" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="1112" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="1134" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="1156" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="1198" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="1222" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="1244" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="1266" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="1288" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="1310" font-size="16" fill="#8b949e" >changed.</text>
<text x="316" y="1352" font-size="17" fill="#e6edf3" font-weight="700">Fleet sessions in the ledger</text>
<text x="316" y="1376" font-size="16" fill="#8b949e" >SessionEnd writes a session</text>
<text x="316" y="1398" font-size="16" fill="#8b949e" >record (cwd, duration,</text>
<text x="316" y="1420" font-size="16" fill="#8b949e" >tokens, dollars) for sessions</text>
<text x="316" y="1442" font-size="16" fill="#8b949e" >cones did not launch; ls</text>
<text x="316" y="1464" font-size="16" fill="#8b949e" >totals it, daily_budget_usd</text>
<text x="316" y="1486" font-size="16" fill="#8b949e" >ignores it.</text>
<text x="582" y="1022" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="582" y="1046" font-size="16" fill="#8b949e" >Enter on a foreign session</text>
<text x="582" y="1068" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="582" y="1090" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="582" y="1112" font-size="16" fill="#8b949e" >there, instead of resuming a</text>
<text x="582" y="1134" font-size="16" fill="#8b949e" >copy.</text>
<rect x="28" y="1530" width="804" height="624" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1542" width="5" height="600" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1560" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1592" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1592" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="316" y="1616" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="316" y="1638" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="316" y="1660" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="316" y="1682" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1592" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1616" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1638" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1660" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1682" font-size="16" fill="#8b949e" >gates the Codex adapter.</text>
<text x="582" y="1724" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1748" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1770" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1792" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1834" font-size="17" fill="#e6edf3" font-weight="700">Codex fleet hooks</text>
<text x="582" y="1858" font-size="16" fill="#8b949e" >cones hook codex, once Codex</text>
<text x="582" y="1880" font-size="16" fill="#8b949e" >hook trust can be configured</text>
<text x="582" y="1902" font-size="16" fill="#8b949e" >without a bypass flag.</text>
<text x="582" y="1944" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="1968" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="1990" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="2012" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="2054" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="2078" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="2100" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="2122" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="2166" width="804" height="382" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="2178" width="5" height="358" rx="2.5" fill="#56d4dd"/>
<text x="46" y="2196" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">COORDINATION</text>
<text x="50" y="2228" font-size="17" fill="#e6edf3" font-weight="700">Lock holder in ls</text>
<text x="50" y="2252" font-size="16" fill="#8b949e" >Holder pid and session id</text>
<text x="50" y="2274" font-size="16" fill="#8b949e" >land beside the .lock; ls,</text>
<text x="50" y="2296" font-size="16" fill="#8b949e" >the dashboard and cones lock</text>
<text x="50" y="2318" font-size="16" fill="#8b949e" >--status show who holds and</text>
<text x="50" y="2340" font-size="16" fill="#8b949e" >who waits; --try exits 1, no</text>
<text x="50" y="2362" font-size="16" fill="#8b949e" >waiting.</text>
<text x="316" y="2228" font-size="17" fill="#e6edf3" font-weight="700">Other coordinators</text>
<text x="316" y="2252" font-size="16" fill="#8b949e" >cones coordinator start</text>
<text x="316" y="2274" font-size="16" fill="#8b949e" >--skill NAME launches any</text>
<text x="316" y="2296" font-size="16" fill="#8b949e" >coordinator skill, Claude</text>
<text x="316" y="2318" font-size="16" fill="#8b949e" >Code or another harness;</text>
<text x="316" y="2340" font-size="16" fill="#8b949e" >start-orchestrator stays the</text>
<text x="316" y="2362" font-size="16" fill="#8b949e" >default.</text>
<text x="582" y="2228" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2252" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2274" font-size="16" fill="#8b949e" >worktree; unlocks overlap:</text>
<text x="582" y="2296" font-size="16" fill="#8b949e" >allow for write jobs. Recipe</text>
<text x="582" y="2318" font-size="16" fill="#8b949e" >from claude-squad, ported as</text>
<text x="582" y="2340" font-size="16" fill="#8b949e" >git commands.</text>
<text x="582" y="2382" font-size="17" fill="#e6edf3" font-weight="700">Cross-harness coordination</text>
<text x="582" y="2406" font-size="16" fill="#8b949e" >The coordinator drives Claude</text>
<text x="582" y="2428" font-size="16" fill="#8b949e" >Code and Codex agents in one</text>
<text x="582" y="2450" font-size="16" fill="#8b949e" >folder alike: Codex arrivals</text>
<text x="582" y="2472" font-size="16" fill="#8b949e" >greeted, gated and relayed,</text>
<text x="582" y="2494" font-size="16" fill="#8b949e" >not only read from their</text>
<text x="582" y="2516" font-size="16" fill="#8b949e" >rollout files.</text>
<text x="28" y="2574" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and</text>
<text x="28" y="2594" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
</svg>