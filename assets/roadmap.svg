<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2604" viewBox="0 0 860 2604" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2604" fill="#0d1117"/>
<rect x="28" y="16" width="804" height="330" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="40" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0</text>
<text x="50" y="64" font-size="13.5" fill="#e6edf3" >• launchd schedule, no daemon</text>
<text x="62" y="84" font-size="13.5" fill="#e6edf3" >between ticks</text>
<text x="50" y="104" font-size="13.5" fill="#e6edf3" >• dollar budget, timeout, turn</text>
<text x="62" y="124" font-size="13.5" fill="#e6edf3" >cap</text>
<text x="50" y="144" font-size="13.5" fill="#e6edf3" >• rolling daily budget</text>
<text x="50" y="164" font-size="13.5" fill="#e6edf3" >• read-only or sandboxed-write</text>
<text x="62" y="184" font-size="13.5" fill="#e6edf3" >policy</text>
<text x="50" y="204" font-size="13.5" fill="#e6edf3" >• overlap skip / allow / replace</text>
<text x="50" y="224" font-size="13.5" fill="#e6edf3" >• one-off runs: cones run</text>
<text x="62" y="244" font-size="13.5" fill="#e6edf3" >--prompt</text>
<text x="50" y="264" font-size="13.5" fill="#e6edf3" >• shared-workspace writer lock</text>
<text x="62" y="284" font-size="13.5" fill="#e6edf3" >(leaving, see NOW)</text>
<text x="50" y="304" font-size="13.5" fill="#e6edf3" >• cones lock around any command</text>
<text x="62" y="324" font-size="13.5" fill="#e6edf3" >(leaving)</text>
<text x="316" y="64" font-size="13.5" fill="#e6edf3" >• opt-in failure notification</text>
<text x="316" y="84" font-size="13.5" fill="#e6edf3" >• durable JSONL run ledger</text>
<text x="316" y="104" font-size="13.5" fill="#e6edf3" >• dollars per run in ls and the</text>
<text x="328" y="124" font-size="13.5" fill="#e6edf3" >ledger</text>
<text x="316" y="144" font-size="13.5" fill="#e6edf3" >• live event stream</text>
<text x="316" y="164" font-size="13.5" fill="#e6edf3" >• fleet from Claude&#x27;s own</text>
<text x="328" y="184" font-size="13.5" fill="#e6edf3" >session registry, no hook</text>
<text x="316" y="204" font-size="13.5" fill="#e6edf3" >• every Claude session in ls and</text>
<text x="328" y="224" font-size="13.5" fill="#e6edf3" >the TUI</text>
<text x="316" y="244" font-size="13.5" fill="#e6edf3" >• model, start, activity and</text>
<text x="328" y="264" font-size="13.5" fill="#e6edf3" >context read from the</text>
<text x="328" y="284" font-size="13.5" fill="#e6edf3" >transcript, never estimated</text>
<text x="316" y="304" font-size="13.5" fill="#e6edf3" >• stop and attach from CLI and</text>
<text x="328" y="324" font-size="13.5" fill="#e6edf3" >TUI</text>
<text x="582" y="64" font-size="13.5" fill="#e6edf3" >• dashboard: details pane,</text>
<text x="594" y="84" font-size="13.5" fill="#e6edf3" >dispatch, grouping</text>
<text x="582" y="104" font-size="13.5" fill="#e6edf3" >• n launches in any folder,</text>
<text x="594" y="124" font-size="13.5" fill="#e6edf3" >interactive or managed</text>
<text x="582" y="144" font-size="13.5" fill="#e6edf3" >• tab reads more of a session,</text>
<text x="594" y="164" font-size="13.5" fill="#e6edf3" >attach returns to the row</text>
<text x="582" y="184" font-size="13.5" fill="#e6edf3" >• key hints follow claude agents</text>
<text x="582" y="204" font-size="13.5" fill="#e6edf3" >• per-harness marks, spinners,</text>
<text x="594" y="224" font-size="13.5" fill="#e6edf3" >colors</text>
<text x="582" y="244" font-size="13.5" fill="#e6edf3" >• doctor: login, job env,</text>
<text x="594" y="264" font-size="13.5" fill="#e6edf3" >version drift, flags</text>
<text x="582" y="284" font-size="13.5" fill="#e6edf3" >• cones coordinator start, skill</text>
<text x="594" y="304" font-size="13.5" fill="#e6edf3" >in the binary</text>
<rect x="36" y="372" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="410" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="430" font-size="12.5" fill="#8b949e" >One dashboard, every harness</text>
<rect x="302" y="372" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="410" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="430" font-size="12.5" fill="#8b949e" >Everyday control of jobs</text>
<rect x="568" y="372" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="410" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="430" font-size="12.5" fill="#8b949e" >Needs a second harness or Mac</text>
<rect x="28" y="446" width="804" height="734" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="458" width="5" height="710" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="476" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">SEE</text>
<text x="50" y="508" font-size="16" fill="#30363d" >—</text>
<text x="316" y="508" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="532" font-size="16" fill="#8b949e" >Each job row shows its next</text>
<text x="316" y="554" font-size="16" fill="#8b949e" >tick, computed from the</text>
<text x="316" y="576" font-size="16" fill="#8b949e" >compiled</text>
<text x="316" y="598" font-size="16" fill="#8b949e" >StartCalendarInterval list</text>
<text x="316" y="620" font-size="16" fill="#8b949e" >and confirmed against the</text>
<text x="316" y="642" font-size="16" fill="#8b949e" >loaded plist.</text>
<text x="316" y="684" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="708" font-size="16" fill="#8b949e" >A write run records git diff</text>
<text x="316" y="730" font-size="16" fill="#8b949e" >--stat of its cwd at exit;</text>
<text x="316" y="752" font-size="16" fill="#8b949e" >cones logs and the details</text>
<text x="316" y="774" font-size="16" fill="#8b949e" >pane show what the run</text>
<text x="316" y="796" font-size="16" fill="#8b949e" >changed.</text>
<text x="316" y="838" font-size="17" fill="#e6edf3" font-weight="700">Touched files</text>
<text x="316" y="862" font-size="16" fill="#8b949e" >Edit and Write paths read</text>
<text x="316" y="884" font-size="16" fill="#8b949e" >from the session&#x27;s</text>
<text x="316" y="906" font-size="16" fill="#8b949e" >transcript; ls --json and the</text>
<text x="316" y="928" font-size="16" fill="#8b949e" >details pane show each</text>
<text x="316" y="950" font-size="16" fill="#8b949e" >footprint. Bash edits are not</text>
<text x="316" y="972" font-size="16" fill="#8b949e" >seen.</text>
<text x="316" y="1014" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="316" y="1038" font-size="16" fill="#8b949e" >cones status &#x27;text&#x27; records a</text>
<text x="316" y="1060" font-size="16" fill="#8b949e" >one-line check-in per session</text>
<text x="316" y="1082" font-size="16" fill="#8b949e" >that fills the last column,</text>
<text x="316" y="1104" font-size="16" fill="#8b949e" >kept apart from the</text>
<text x="316" y="1126" font-size="16" fill="#8b949e" >active/idle/blocked state</text>
<text x="316" y="1148" font-size="16" fill="#8b949e" >Claude reports.</text>
<text x="582" y="508" font-size="17" fill="#e6edf3" font-weight="700">Fleet session records</text>
<text x="582" y="532" font-size="16" fill="#8b949e" >A session cones did not</text>
<text x="582" y="554" font-size="16" fill="#8b949e" >launch gets a ledger record</text>
<text x="582" y="576" font-size="16" fill="#8b949e" >when it leaves Claude&#x27;s</text>
<text x="582" y="598" font-size="16" fill="#8b949e" >registry: cwd, duration,</text>
<text x="582" y="620" font-size="16" fill="#8b949e" >tokens, dollars as last</text>
<text x="582" y="642" font-size="16" fill="#8b949e" >reported. ls totals it,</text>
<text x="582" y="664" font-size="16" fill="#8b949e" >daily_budget_usd ignores it.</text>
<rect x="28" y="1192" width="804" height="206" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1204" width="5" height="182" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1222" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">MOVE AND CONTROL</text>
<text x="50" y="1254" font-size="16" fill="#30363d" >—</text>
<text x="316" y="1254" font-size="17" fill="#e6edf3" font-weight="700">Job lifecycle hooks</text>
<text x="316" y="1278" font-size="16" fill="#8b949e" >Opt-in commands on start,</text>
<text x="316" y="1300" font-size="16" fill="#8b949e" >exit and failure for jobs</text>
<text x="316" y="1322" font-size="16" fill="#8b949e" >cones launches, set in</text>
<text x="316" y="1344" font-size="16" fill="#8b949e" >jobs.yaml. Nothing hooks</text>
<text x="316" y="1366" font-size="16" fill="#8b949e" >sessions cones did not start.</text>
<text x="582" y="1254" font-size="17" fill="#e6edf3" font-weight="700">Jump to pane</text>
<text x="582" y="1278" font-size="16" fill="#8b949e" >Enter on a foreign session</text>
<text x="582" y="1300" font-size="16" fill="#8b949e" >resolves pid to tty to tmux</text>
<text x="582" y="1322" font-size="16" fill="#8b949e" >or iTerm pane and switches</text>
<text x="582" y="1344" font-size="16" fill="#8b949e" >there, instead of resuming a</text>
<text x="582" y="1366" font-size="16" fill="#8b949e" >copy.</text>
<rect x="28" y="1410" width="804" height="668" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1422" width="5" height="644" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1440" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1472" font-size="17" fill="#e6edf3" font-weight="700">Codex in the fleet</text>
<text x="50" y="1496" font-size="16" fill="#8b949e" >Codex keeps no session</text>
<text x="50" y="1518" font-size="16" fill="#8b949e" >registry: pid and cwd from</text>
<text x="50" y="1540" font-size="16" fill="#8b949e" >the process table, title and</text>
<text x="50" y="1562" font-size="16" fill="#8b949e" >last line from its rollout</text>
<text x="50" y="1584" font-size="16" fill="#8b949e" >file. Seeing Codex sessions</text>
<text x="50" y="1606" font-size="16" fill="#8b949e" >does not wait for Codex</text>
<text x="50" y="1628" font-size="16" fill="#8b949e" >budgets or jobs.</text>
<text x="316" y="1472" font-size="16" fill="#30363d" >—</text>
<text x="582" y="1472" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="582" y="1496" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="582" y="1518" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="582" y="1540" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="582" y="1562" font-size="16" fill="#8b949e" >gates Codex jobs, not Codex</text>
<text x="582" y="1584" font-size="16" fill="#8b949e" >in the fleet.</text>
<text x="582" y="1626" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="582" y="1650" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="582" y="1672" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="582" y="1694" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="582" y="1736" font-size="17" fill="#e6edf3" font-weight="700">File triggers</text>
<text x="582" y="1760" font-size="16" fill="#8b949e" >Run on path change via</text>
<text x="582" y="1782" font-size="16" fill="#8b949e" >launchd WatchPaths; a few</text>
<text x="582" y="1804" font-size="16" fill="#8b949e" >plist lines, no watcher</text>
<text x="582" y="1826" font-size="16" fill="#8b949e" >process.</text>
<text x="582" y="1868" font-size="17" fill="#e6edf3" font-weight="700">Webhook triggers</text>
<text x="582" y="1892" font-size="16" fill="#8b949e" >Run on an HTTP call. Needs a</text>
<text x="582" y="1914" font-size="16" fill="#8b949e" >listener process, so after</text>
<text x="582" y="1936" font-size="16" fill="#8b949e" >single-machine fleet control.</text>
<text x="582" y="1978" font-size="17" fill="#e6edf3" font-weight="700">More Macs</text>
<text x="582" y="2002" font-size="16" fill="#8b949e" >Multi-machine after single-</text>
<text x="582" y="2024" font-size="16" fill="#8b949e" >machine fleet control is in</text>
<text x="582" y="2046" font-size="16" fill="#8b949e" >regular use.</text>
<rect x="28" y="2090" width="804" height="404" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="2102" width="5" height="380" rx="2.5" fill="#f0883e"/>
<text x="46" y="2120" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="2152" font-size="17" fill="#e6edf3" font-weight="700">Writer lock removal</text>
<text x="50" y="2176" font-size="16" fill="#8b949e" >The runner flock, the</text>
<text x="50" y="2198" font-size="16" fill="#8b949e" >workspace skip reason, cones</text>
<text x="50" y="2220" font-size="16" fill="#8b949e" >lock DIR -- CMD and the</text>
<text x="50" y="2242" font-size="16" fill="#8b949e" >validate rule against</text>
<text x="50" y="2264" font-size="16" fill="#8b949e" >overlap: allow with write go.</text>
<text x="50" y="2286" font-size="16" fill="#8b949e" >Ledger and admission locks</text>
<text x="50" y="2308" font-size="16" fill="#8b949e" >stay. Ruled, not yet in code.</text>
<text x="50" y="2350" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="2374" font-size="16" fill="#8b949e" >Version, install steps and</text>
<text x="50" y="2396" font-size="16" fill="#8b949e" >verification record are in;</text>
<text x="50" y="2418" font-size="16" fill="#8b949e" >tag v0.1.0 and publish under</text>
<text x="50" y="2440" font-size="16" fill="#8b949e" >the personal account. Owner</text>
<text x="50" y="2462" font-size="16" fill="#8b949e" >action, no code left.</text>
<text x="316" y="2152" font-size="17" fill="#e6edf3" font-weight="700">overlap: continue</text>
<text x="316" y="2176" font-size="16" fill="#8b949e" >A tick that finds the</text>
<text x="316" y="2198" font-size="16" fill="#8b949e" >previous run still going</text>
<text x="316" y="2220" font-size="16" fill="#8b949e" >stops it and starts the new</text>
<text x="316" y="2242" font-size="16" fill="#8b949e" >run with claude --resume on</text>
<text x="316" y="2264" font-size="16" fill="#8b949e" >run 1&#x27;s session id, so run 2</text>
<text x="316" y="2286" font-size="16" fill="#8b949e" >keeps what run 1 learned.</text>
<text x="316" y="2328" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="316" y="2352" font-size="16" fill="#8b949e" >One slept-through tick fires</text>
<text x="316" y="2374" font-size="16" fill="#8b949e" >one run on wake, none after a</text>
<text x="316" y="2396" font-size="16" fill="#8b949e" >reboot past one; observed in</text>
<text x="316" y="2418" font-size="16" fill="#8b949e" >cones ls --json and written</text>
<text x="316" y="2440" font-size="16" fill="#8b949e" >into the README.</text>
<text x="582" y="2152" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="582" y="2176" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="582" y="2198" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="582" y="2220" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="2262" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="582" y="2286" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="582" y="2308" font-size="16" fill="#8b949e" >worktree. Recipe from claude-</text>
<text x="582" y="2330" font-size="16" fill="#8b949e" >squad, ported as git</text>
<text x="582" y="2352" font-size="16" fill="#8b949e" >commands. Only if shared</text>
<text x="582" y="2374" font-size="16" fill="#8b949e" >directories prove</text>
<text x="582" y="2396" font-size="16" fill="#8b949e" >insufficient.</text>
<text x="28" y="2520" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets and the ledger. The harness owns execution and</text>
<text x="28" y="2540" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
<text x="28" y="2560" font-size="14" fill="#8b949e" >Seeing a harness&#x27;s sessions never waits on enforcing its budgets.</text>
</svg>