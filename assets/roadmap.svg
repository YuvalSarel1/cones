<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1616" viewBox="0 0 1200 1616" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1200" height="1616" fill="#0d1117"/>
<text x="40" y="62" font-size="38" fill="#e6edf3" font-weight="700">cones roadmap</text>
<text x="40" y="92" font-size="18" fill="#8b949e" >Scheduled coding-agent jobs on your Mac, under explicit policy, with every run accounted for.</text>
<rect x="40" y="112" width="1120" height="112" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="58" y="136" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0-headless</text>
<text x="58" y="160" font-size="16" fill="#e6edf3" >Claude jobs on a launchd schedule · dollar budget, timeout, turn cap · read-only or sandboxed-write policy · rolling daily budget</text>
<text x="58" y="182" font-size="16" fill="#e6edf3" >· live event stream · stop, list, resume in Claude&#x27;s TUI · overlap skip / allow / replace · shared-workspace writer lock · durable</text>
<text x="58" y="204" font-size="16" fill="#e6edf3" >run ledger</text>
<rect x="190" y="252" width="314" height="6" rx="3" fill="#3fb950"/>
<text x="206" y="290" font-size="24" fill="#3fb950" font-weight="800" letter-spacing="2">NOW</text>
<text x="206" y="312" font-size="13.5" fill="#8b949e" >Make the first release trustworthy</text>
<rect x="518" y="252" width="314" height="6" rx="3" fill="#58a6ff"/>
<text x="534" y="290" font-size="24" fill="#58a6ff" font-weight="800" letter-spacing="2">NEXT</text>
<text x="534" y="312" font-size="13.5" fill="#8b949e" >More harnesses, less manual follow-up</text>
<rect x="846" y="252" width="314" height="6" rx="3" fill="#bc8cff"/>
<text x="862" y="290" font-size="24" fill="#bc8cff" font-weight="800" letter-spacing="2">LATER</text>
<text x="862" y="312" font-size="13.5" fill="#8b949e" >From scheduler to fleet control</text>
<rect x="40" y="328" width="1120" height="346" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="40" y="340" width="5" height="322" rx="2.5" fill="#f0883e"/>
<text x="60" y="362" font-size="16" fill="#f0883e" font-weight="700">Reliability</text>
<text x="206" y="362" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="206" y="384" font-size="14.5" fill="#8b949e" >launchd catch-up after lid-close and</text>
<text x="206" y="404" font-size="14.5" fill="#8b949e" >reboot verified; what replays and</text>
<text x="206" y="424" font-size="14.5" fill="#8b949e" >what is lost, documented.</text>
<text x="206" y="462" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="206" y="484" font-size="14.5" fill="#8b949e" >Install steps and verification</text>
<text x="206" y="504" font-size="14.5" fill="#8b949e" >record, published under the personal</text>
<text x="206" y="524" font-size="14.5" fill="#8b949e" >account.</text>
<text x="206" y="562" font-size="17" fill="#e6edf3" font-weight="700">Doctor covers auth</text>
<text x="206" y="584" font-size="14.5" fill="#8b949e" >cones doctor verifies Claude login</text>
<text x="206" y="604" font-size="14.5" fill="#8b949e" >and every env var a job imports, so</text>
<text x="206" y="624" font-size="14.5" fill="#8b949e" >a scheduled run does not fail on</text>
<text x="206" y="644" font-size="14.5" fill="#8b949e" >missing credentials.</text>
<text x="534" y="362" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="534" y="384" font-size="14.5" fill="#8b949e" >Bounded retry for transient</text>
<text x="534" y="404" font-size="14.5" fill="#8b949e" >failures, chain visible in the</text>
<text x="534" y="424" font-size="14.5" fill="#8b949e" >ledger.</text>
<text x="862" y="362" font-size="16" fill="#30363d" >—</text>
<rect x="40" y="686" width="1120" height="206" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="40" y="698" width="5" height="182" rx="2.5" fill="#d2a8ff"/>
<text x="60" y="720" font-size="16" fill="#d2a8ff" font-weight="700">Observability</text>
<text x="206" y="720" font-size="17" fill="#e6edf3" font-weight="700">Failure notification</text>
<text x="206" y="742" font-size="14.5" fill="#8b949e" >Opt-in macOS notification on failed,</text>
<text x="206" y="762" font-size="14.5" fill="#8b949e" >crashed or budget-skipped runs.</text>
<text x="206" y="800" font-size="17" fill="#e6edf3" font-weight="700">Run summary in ls</text>
<text x="206" y="822" font-size="14.5" fill="#8b949e" >One line per run: what it did, cost,</text>
<text x="206" y="842" font-size="14.5" fill="#8b949e" >why it stopped.</text>
<text x="534" y="720" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="534" y="742" font-size="14.5" fill="#8b949e" >See what runs next, not only what</text>
<text x="534" y="762" font-size="14.5" fill="#8b949e" >already ran.</text>
<text x="534" y="800" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="534" y="822" font-size="14.5" fill="#8b949e" >The working-tree change a run</text>
<text x="534" y="842" font-size="14.5" fill="#8b949e" >produced, from the ledger.</text>
<text x="862" y="720" font-size="17" fill="#e6edf3" font-weight="700">Fleet view</text>
<text x="862" y="742" font-size="14.5" fill="#8b949e" >Everything running on the machine:</text>
<text x="862" y="762" font-size="14.5" fill="#8b949e" >who, where, on what, busy/idle,</text>
<text x="862" y="782" font-size="14.5" fill="#8b949e" >cost. Side pane or TUI.</text>
<text x="862" y="820" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="862" y="842" font-size="14.5" fill="#8b949e" >Started, milestone, blocked, done</text>
<text x="862" y="862" font-size="14.5" fill="#8b949e" >from the agent itself.</text>
<rect x="40" y="904" width="1120" height="206" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="40" y="916" width="5" height="182" rx="2.5" fill="#79c0ff"/>
<text x="60" y="938" font-size="16" fill="#79c0ff" font-weight="700">Harnesses</text>
<text x="206" y="938" font-size="16" fill="#30363d" >—</text>
<text x="534" y="938" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="534" y="960" font-size="14.5" fill="#8b949e" >Real token budget, rejected when</text>
<text x="534" y="980" font-size="14.5" fill="#8b949e" >unenforceable. Same policy file,</text>
<text x="534" y="1000" font-size="14.5" fill="#8b949e" >second harness.</text>
<text x="534" y="1038" font-size="17" fill="#e6edf3" font-weight="700">File and webhook triggers</text>
<text x="534" y="1060" font-size="14.5" fill="#8b949e" >Run on path change or HTTP call, not</text>
<text x="534" y="1080" font-size="14.5" fill="#8b949e" >only on a calendar.</text>
<text x="862" y="938" font-size="17" fill="#e6edf3" font-weight="700">More harnesses, more Macs</text>
<text x="862" y="960" font-size="14.5" fill="#8b949e" >Pi when a real use case appears;</text>
<text x="862" y="980" font-size="14.5" fill="#8b949e" >multi-machine after single-machine</text>
<text x="862" y="1000" font-size="14.5" fill="#8b949e" >fleet control is in regular use.</text>
<rect x="40" y="1122" width="1120" height="406" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="40" y="1134" width="5" height="382" rx="2.5" fill="#56d4dd"/>
<text x="60" y="1156" font-size="16" fill="#56d4dd" font-weight="700">Coordination</text>
<text x="206" y="1156" font-size="16" fill="#30363d" >—</text>
<text x="534" y="1156" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="534" y="1178" font-size="14.5" fill="#8b949e" >Concurrent writers each get a</text>
<text x="534" y="1198" font-size="14.5" fill="#8b949e" >worktree; unlocks overlap: allow for</text>
<text x="534" y="1218" font-size="14.5" fill="#8b949e" >write jobs.</text>
<text x="862" y="1156" font-size="17" fill="#e6edf3" font-weight="700">Fleet roster</text>
<text x="862" y="1178" font-size="14.5" fill="#8b949e" >cones launches agents with a name,</text>
<text x="862" y="1198" font-size="14.5" fill="#8b949e" >cwd, task and declared file scope;</text>
<text x="862" y="1218" font-size="14.5" fill="#8b949e" >the roster is the source of truth.</text>
<text x="862" y="1256" font-size="17" fill="#e6edf3" font-weight="700">Commit lock and queue</text>
<text x="862" y="1278" font-size="14.5" fill="#8b949e" >Agents acquire a per-repo lock</text>
<text x="862" y="1298" font-size="14.5" fill="#8b949e" >before committing; cones grants in</text>
<text x="862" y="1318" font-size="14.5" fill="#8b949e" >order. Workers never push or stash.</text>
<text x="862" y="1356" font-size="17" fill="#e6edf3" font-weight="700">Coordinator token</text>
<text x="862" y="1378" font-size="14.5" fill="#8b949e" >Coordinator messages carry a per-run</text>
<text x="862" y="1398" font-size="14.5" fill="#8b949e" >token; workers ignore messages</text>
<text x="862" y="1418" font-size="14.5" fill="#8b949e" >without it.</text>
<text x="862" y="1456" font-size="17" fill="#e6edf3" font-weight="700">Standing orders</text>
<text x="862" y="1478" font-size="14.5" fill="#8b949e" >Fleet rules as data, checked when</text>
<text x="862" y="1498" font-size="14.5" fill="#8b949e" >the last job ends.</text>
<text x="40" y="1554" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and permissions. Unenforceable guarantees</text>
<text x="40" y="1573" font-size="14" fill="#8b949e" >are validation errors, never a second permission engine.</text>
</svg>