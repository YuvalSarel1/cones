<svg xmlns="http://www.w3.org/2000/svg" width="860" height="2066" viewBox="0 0 860 2066" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="2066" fill="#0d1117"/>
<text x="28" y="62" font-size="32" fill="#e6edf3" font-weight="700">cones roadmap</text>
<text x="28" y="92" font-size="16" fill="#8b949e" >Scheduled coding-agent jobs on your Mac, under explicit policy, with every run accounted for.</text>
<rect x="28" y="112" width="804" height="134" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="46" y="136" font-size="12" fill="#3fb950" font-weight="700" letter-spacing="1.5">SHIPPED  v0.1.0-headless</text>
<text x="44" y="160" font-size="15" fill="#e6edf3" >Claude jobs on a launchd schedule · dollar budget, timeout, turn cap · read-only or sandboxed-</text>
<text x="44" y="182" font-size="15" fill="#e6edf3" >write policy · rolling daily budget · live event stream · terminal dashboard · stop, list,</text>
<text x="44" y="204" font-size="15" fill="#e6edf3" >resume in Claude&#x27;s TUI · overlap skip / allow / replace · shared-workspace writer lock · durable</text>
<text x="44" y="226" font-size="15" fill="#e6edf3" >run ledger</text>
<rect x="36" y="272" width="254" height="6" rx="3" fill="#3fb950"/>
<text x="50" y="310" font-size="22" fill="#3fb950" font-weight="800" letter-spacing="1.5">NOW</text>
<text x="50" y="330" font-size="12.5" fill="#8b949e" >Make the first release trustworthy</text>
<rect x="302" y="272" width="254" height="6" rx="3" fill="#58a6ff"/>
<text x="316" y="310" font-size="22" fill="#58a6ff" font-weight="800" letter-spacing="1.5">NEXT</text>
<text x="316" y="330" font-size="12.5" fill="#8b949e" >More harnesses, less manual follow-up</text>
<rect x="568" y="272" width="254" height="6" rx="3" fill="#bc8cff"/>
<text x="582" y="310" font-size="22" fill="#bc8cff" font-weight="800" letter-spacing="1.5">LATER</text>
<text x="582" y="330" font-size="12.5" fill="#8b949e" >From scheduler to fleet control</text>
<rect x="28" y="346" width="804" height="470" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="358" width="5" height="446" rx="2.5" fill="#f0883e"/>
<text x="46" y="376" font-size="12.5" fill="#f0883e" font-weight="700" letter-spacing="1.5">RELIABILITY</text>
<text x="50" y="408" font-size="17" fill="#e6edf3" font-weight="700">Sleep/wake proof</text>
<text x="50" y="432" font-size="16" fill="#8b949e" >launchd catch-up after lid-</text>
<text x="50" y="454" font-size="16" fill="#8b949e" >close and reboot verified;</text>
<text x="50" y="476" font-size="16" fill="#8b949e" >what replays and what is</text>
<text x="50" y="498" font-size="16" fill="#8b949e" >lost, documented.</text>
<text x="50" y="540" font-size="17" fill="#e6edf3" font-weight="700">Public release</text>
<text x="50" y="564" font-size="16" fill="#8b949e" >Install steps and</text>
<text x="50" y="586" font-size="16" fill="#8b949e" >verification record,</text>
<text x="50" y="608" font-size="16" fill="#8b949e" >published under the personal</text>
<text x="50" y="630" font-size="16" fill="#8b949e" >account.</text>
<text x="50" y="672" font-size="17" fill="#e6edf3" font-weight="700">Doctor covers auth</text>
<text x="50" y="696" font-size="16" fill="#8b949e" >cones doctor verifies Claude</text>
<text x="50" y="718" font-size="16" fill="#8b949e" >login and every env var a job</text>
<text x="50" y="740" font-size="16" fill="#8b949e" >imports, so a scheduled run</text>
<text x="50" y="762" font-size="16" fill="#8b949e" >does not fail on missing</text>
<text x="50" y="784" font-size="16" fill="#8b949e" >credentials.</text>
<text x="316" y="408" font-size="17" fill="#e6edf3" font-weight="700">Retries with backoff</text>
<text x="316" y="432" font-size="16" fill="#8b949e" >Bounded retry for transient</text>
<text x="316" y="454" font-size="16" fill="#8b949e" >failures, chain visible in</text>
<text x="316" y="476" font-size="16" fill="#8b949e" >the ledger.</text>
<text x="582" y="408" font-size="16" fill="#30363d" >—</text>
<rect x="28" y="828" width="804" height="272" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="840" width="5" height="248" rx="2.5" fill="#d2a8ff"/>
<text x="46" y="858" font-size="12.5" fill="#d2a8ff" font-weight="700" letter-spacing="1.5">OBSERVABILITY</text>
<text x="50" y="890" font-size="17" fill="#e6edf3" font-weight="700">Failure notification</text>
<text x="50" y="914" font-size="16" fill="#8b949e" >Opt-in macOS notification on</text>
<text x="50" y="936" font-size="16" fill="#8b949e" >failed, crashed or budget-</text>
<text x="50" y="958" font-size="16" fill="#8b949e" >skipped runs.</text>
<text x="50" y="1000" font-size="17" fill="#e6edf3" font-weight="700">Run summary in ls</text>
<text x="50" y="1024" font-size="16" fill="#8b949e" >One line per run: what it</text>
<text x="50" y="1046" font-size="16" fill="#8b949e" >did, cost, why it stopped.</text>
<text x="316" y="890" font-size="17" fill="#e6edf3" font-weight="700">Next fire time in ls</text>
<text x="316" y="914" font-size="16" fill="#8b949e" >See what runs next, not only</text>
<text x="316" y="936" font-size="16" fill="#8b949e" >what already ran.</text>
<text x="316" y="978" font-size="17" fill="#e6edf3" font-weight="700">Run diffs</text>
<text x="316" y="1002" font-size="16" fill="#8b949e" >The working-tree change a run</text>
<text x="316" y="1024" font-size="16" fill="#8b949e" >produced, from the ledger.</text>
<text x="582" y="890" font-size="17" fill="#e6edf3" font-weight="700">Fleet view</text>
<text x="582" y="914" font-size="16" fill="#8b949e" >Everything running on the</text>
<text x="582" y="936" font-size="16" fill="#8b949e" >machine: who, where, on what,</text>
<text x="582" y="958" font-size="16" fill="#8b949e" >busy/idle, cost. Side pane or</text>
<text x="582" y="980" font-size="16" fill="#8b949e" >TUI.</text>
<text x="582" y="1022" font-size="17" fill="#e6edf3" font-weight="700">Status transitions</text>
<text x="582" y="1046" font-size="16" fill="#8b949e" >Started, milestone, blocked,</text>
<text x="582" y="1068" font-size="16" fill="#8b949e" >done from the agent itself.</text>
<rect x="28" y="1112" width="804" height="338" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1124" width="5" height="314" rx="2.5" fill="#79c0ff"/>
<text x="46" y="1142" font-size="12.5" fill="#79c0ff" font-weight="700" letter-spacing="1.5">HARNESSES</text>
<text x="50" y="1174" font-size="17" fill="#e6edf3" font-weight="700">Harness compatibility check</text>
<text x="50" y="1198" font-size="16" fill="#8b949e" >cones doctor compares the</text>
<text x="50" y="1220" font-size="16" fill="#8b949e" >installed Claude version and</text>
<text x="50" y="1242" font-size="16" fill="#8b949e" >the flags cones compiles to</text>
<text x="50" y="1264" font-size="16" fill="#8b949e" >against the tested set, and</text>
<text x="50" y="1286" font-size="16" fill="#8b949e" >reports drift before install.</text>
<text x="50" y="1328" font-size="17" fill="#e6edf3" font-weight="700">Codex budget probe</text>
<text x="50" y="1352" font-size="16" fill="#8b949e" >Measure Codex usage events to</text>
<text x="50" y="1374" font-size="16" fill="#8b949e" >decide whether a token budget</text>
<text x="50" y="1396" font-size="16" fill="#8b949e" >can be enforced; the result</text>
<text x="50" y="1418" font-size="16" fill="#8b949e" >gates the Codex adapter.</text>
<text x="316" y="1174" font-size="17" fill="#e6edf3" font-weight="700">Codex jobs</text>
<text x="316" y="1198" font-size="16" fill="#8b949e" >Real token budget, rejected</text>
<text x="316" y="1220" font-size="16" fill="#8b949e" >when unenforceable. Same</text>
<text x="316" y="1242" font-size="16" fill="#8b949e" >policy file, second harness.</text>
<text x="316" y="1284" font-size="17" fill="#e6edf3" font-weight="700">File and webhook triggers</text>
<text x="316" y="1308" font-size="16" fill="#8b949e" >Run on path change or HTTP</text>
<text x="316" y="1330" font-size="16" fill="#8b949e" >call, not only on a calendar.</text>
<text x="582" y="1174" font-size="17" fill="#e6edf3" font-weight="700">More harnesses, more Macs</text>
<text x="582" y="1198" font-size="16" fill="#8b949e" >Pi when a real use case</text>
<text x="582" y="1220" font-size="16" fill="#8b949e" >appears; multi-machine after</text>
<text x="582" y="1242" font-size="16" fill="#8b949e" >single-machine fleet control</text>
<text x="582" y="1264" font-size="16" fill="#8b949e" >is in regular use.</text>
<rect x="28" y="1462" width="804" height="514" rx="10" fill="#161b22" stroke="#30363d"/>
<rect x="28" y="1474" width="5" height="490" rx="2.5" fill="#56d4dd"/>
<text x="46" y="1492" font-size="12.5" fill="#56d4dd" font-weight="700" letter-spacing="1.5">COORDINATION</text>
<text x="50" y="1524" font-size="17" fill="#e6edf3" font-weight="700">Lock CLI</text>
<text x="50" y="1548" font-size="16" fill="#8b949e" >cones lock and unlock expose</text>
<text x="50" y="1570" font-size="16" fill="#8b949e" >the existing workspace writer</text>
<text x="50" y="1592" font-size="16" fill="#8b949e" >lock, so interactive agents</text>
<text x="50" y="1614" font-size="16" fill="#8b949e" >can serialize commits on a</text>
<text x="50" y="1636" font-size="16" fill="#8b949e" >shared repo today.</text>
<text x="316" y="1524" font-size="17" fill="#e6edf3" font-weight="700">Worktree per run</text>
<text x="316" y="1548" font-size="16" fill="#8b949e" >Concurrent writers each get a</text>
<text x="316" y="1570" font-size="16" fill="#8b949e" >worktree; unlocks overlap:</text>
<text x="316" y="1592" font-size="16" fill="#8b949e" >allow for write jobs.</text>
<text x="582" y="1524" font-size="17" fill="#e6edf3" font-weight="700">Fleet roster</text>
<text x="582" y="1548" font-size="16" fill="#8b949e" >cones launches agents with a</text>
<text x="582" y="1570" font-size="16" fill="#8b949e" >name, cwd, task and declared</text>
<text x="582" y="1592" font-size="16" fill="#8b949e" >file scope; the roster is the</text>
<text x="582" y="1614" font-size="16" fill="#8b949e" >source of truth.</text>
<text x="582" y="1656" font-size="17" fill="#e6edf3" font-weight="700">Commit lock and queue</text>
<text x="582" y="1680" font-size="16" fill="#8b949e" >Agents acquire a per-repo</text>
<text x="582" y="1702" font-size="16" fill="#8b949e" >lock before committing; cones</text>
<text x="582" y="1724" font-size="16" fill="#8b949e" >grants in order. Workers</text>
<text x="582" y="1746" font-size="16" fill="#8b949e" >never push or stash.</text>
<text x="582" y="1788" font-size="17" fill="#e6edf3" font-weight="700">Coordinator token</text>
<text x="582" y="1812" font-size="16" fill="#8b949e" >Coordinator messages carry a</text>
<text x="582" y="1834" font-size="16" fill="#8b949e" >per-run token; workers ignore</text>
<text x="582" y="1856" font-size="16" fill="#8b949e" >messages without it.</text>
<text x="582" y="1898" font-size="17" fill="#e6edf3" font-weight="700">Standing orders</text>
<text x="582" y="1922" font-size="16" fill="#8b949e" >Fleet rules as data, checked</text>
<text x="582" y="1944" font-size="16" fill="#8b949e" >when the last job ends.</text>
<text x="28" y="2002" font-size="14" fill="#8b949e" >cones owns the clock, supervision, budgets, locks and ledger. The harness owns execution and</text>
<text x="28" y="2022" font-size="14" fill="#8b949e" >permissions. Unenforceable guarantees are validation errors, never a second permission engine.</text>
</svg>