version: 2
kind: opencode
icon: "o"
colour: [190, 190, 190]
home:
  env: XDG_DATA_HOME
  default: {base: xdg_data, path: opencode}
discovery:
  process: opencode
  exclude_subcommands:
    - acp
    - agent
    - api
    - auth
    - completion
    - db
    - debug
    - export
    - github
    - import
    - mcp
    - models
    - pair
    - plugin
    - plug
    - providers
    - reload
    - serve
    - service
    - session
    - stats
    - uninstall
    - upgrade
    - web
    - --help
    - -h
    - --version
    - -v
state:
  rules:
    - when: {/type: session.status}
      field: /waiting
      values: {permission: blocked, question: blocked}
    - when: {/type: session.status}
      field: /status/type
      values: {busy: active, retry: active, idle: idle}
transcript:
  roots:
    - {path: opencode.db, env: OPENCODE_DB, depth: 0, archived: false}
  messages:
    user:
      id: /id
      sources:
        - when: {/role: user}
          path: /text
          shape: string
    assistant:
      id: /id
      sources:
        - when: {/role: assistant}
          path: /text
          shape: string
operations:
  rename: true
  launch:
    identity: client_pid
    skip_permissions: [--auto]
    model: --model
    prompt: [--prompt, "{prompt}"]
    probe:
      args: [--help]
      output: any
      contains: [--prompt, --session]
      error: "this OpenCode does not support native prompt and session flags"
      description: "OpenCode runs in a persistent cones terminal; saved conversations resume by session id"
  fork:
    args: [--session, "{id}", --fork]
    probe:
      args: [--help]
      output: any
      require_success: false
      contains: [fork]
      error: "this opencode does not support native forks"
      description: "opencode: native session forks"
  btw:
    # A headless fork on OpenCode's read-only plan agent. OpenCode saves every fork, so cones
    # deletes the one its JSON events name.
    args: [run, --session, "{id}", --fork, --agent, plan, --format, json, --, "{text}"]
    probe:
      args: [run, --help]
      output: any
      require_success: false
      contains: [--fork, --agent, --format]
      error: "this opencode cannot run a fork headless, so a side question cannot be asked"
      description: "opencode: side questions in a read-only fork cones deletes"
  compact: true
  resume:
    args: [--session, "{id}"]
  message:
    reporter: session.prompt_async
execution:
  enforcement: unsupported
viewer:
  input_alignment: fixed
  input:
    empty_prompt: opencode
    return_to_list:
      - {key: ctrl+z, when: always}
      - {key: left, when: empty_prompt}
