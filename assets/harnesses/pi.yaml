version: 1
kind: pi
name: pi
icon: "π"
colour: [138, 190, 183]
home:
  env: PI_CODING_AGENT_DIR
  sibling: .pi/agent
  siblings: null
discovery:
  handler: pi
  registry: null
  daemon: null
  exclude_subcommands: []
  process: pi
state:
  handler: event_map
  rules:
    - when: {"/type": message}
      field: /message/role
      values: {user: active, toolResult: active}
      otherwise: null
    - when: {"/type": message, "/message/role": assistant}
      field: /message/stopReason
      values: {toolUse: active, stop: idle, aborted: stopped, error: failed}
      otherwise: "-"
transcript:
  handler: pi
  messages:
    user:
      id: /id
      headline: first
      sources:
        - when: {"/type": message, "/message/role": user}
          unless: []
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
    assistant:
      id: /id
      headline: last
      sources:
        - when: {"/type": message, "/message/role": assistant}
          unless: []
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
  roots:
    - {path: sessions, depth: 1, archived: false}
  statusline: null
launch:
  handler: terminal
  identity: client_pid
  session_kind: null
  prefix: []
  remote: []
  model: null
  prompt: [--, "{prompt}"]
probe:
  args: [--version]
  require_success: true
  contains: []
  version: {format: text}
  error: "this pi does not run, so no session could be started"
  description: "pi {version}: a session in the dashboard's own viewer, which ends with it, since pi has no background mode, daemon or attach"
default_session: {join: unavailable, stop: signal, lifetime: terminal}
session_kinds: {}
commands:
  attach: []
  resume: [--session, "{transcript}"]
  remove: []
  unarchive: []
  resume_handler: transcript
  viewer: pi
execution:
  enforcement: unsupported
  result: unknown
input:
  return_to_list:
    - {key: ctrl+z, when: always}
    - {key: tab, when: always}
    - {key: left, when: empty_prompt}
  empty_prompt: bordered
  markers: ""
  ignore_braille: false
viewer:
  peek: unavailable
  peek_blocked_states: []
  retention: retain
  input_alignment: bottom_rule
