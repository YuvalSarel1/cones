version: 2
kind: pi
icon: "π"
colour: [138, 190, 183]
home:
  env: PI_CODING_AGENT_DIR
  default: {base: provided_parent, path: .pi/agent}
discovery:
  process: pi
  exclude_subcommands: ["--help", "-h", "--version"]
state:
  rules:
    - when: {/type: message}
      field: /message/role
      values: {user: active, toolResult: active}
    - when: {/type: message, /message/role: assistant}
      field: /message/stopReason
      values: {toolUse: active, stop: idle, aborted: stopped, error: failed}
      otherwise: "-"
transcript:
  messages:
    user:
      id: /id
      sources:
        - when: {/type: message, /message/role: user}
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
    assistant:
      id: /id
      headline: last
      sources:
        - when: {/type: message, /message/role: assistant}
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
  roots:
    - {path: sessions, env: PI_CODING_AGENT_SESSION_DIR, depth: 1, archived: false}
operations:
  launch:
    identity: client_pid
    model: --model
    provider: --provider
    effort: --thinking
    prompt: [--, "{prompt}"]
    probe:
      args: [--version]
      version: {format: text}
      error: "this pi does not run, so no session could be started"
      description: "pi {version}: a native session in a persistent cones terminal; pi has no native background mode or attach"
  fork:
    args: [--fork, "{transcript}", --session-id, "{new_id}"]
    probe:
      args: [--help]
      require_success: false
      contains: [--fork, --session-id]
      error: "this pi does not support native forks"
      description: "pi: native session forks"
  resume:
    args: [--session, "{transcript}"]
execution:
  enforcement: unsupported
viewer:
  input:
    empty_prompt: bordered
    ignore_braille: false
