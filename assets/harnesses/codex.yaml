version: 2
kind: codex
icon: ">_"
home:
  env: CODEX_HOME
  default: {base: provided_parent, path: .codex}
  siblings: {prefix: .codex-, marker: config.toml}
discovery:
  daemon: {pid: app-server-daemon/app-server.pid, locks: thread-writer-locks}
  process: codex
  unsaved: [--ephemeral]
  exclude_subcommands:
    - --help
    - -h
    - --version
    - -V
    - help
    - agents
    - login
    - logout
    - mcp
    - mcp-server
    - plugin
    - app-server
    - remote-control
    - app
    - completion
    - update
    - doctor
    - sandbox
    - debug
    - apply
    - a
    - queue
    - archive
    - delete
    - migrate-rollouts
    - unarchive
    - cloud
    - exec-server
    - features
state:
  rules:
    - when: {/type: event_msg}
      field: /payload/type
      values: {task_started: active, task_complete: done, turn_aborted: stopped}
transcript:
  messages:
    user:
      id: /payload/item/id
      sources:
        - when: {/type: event_msg, /payload/item/type: UserMessage}
          path: /payload/item/content
          shape: blocks
        - when: {/type: event_msg, /payload/type: user_message}
          path: /payload/message
          shape: string
    assistant:
      id: /payload/id
      sources:
        - when: {/type: response_item, /payload/type: message, /payload/role: assistant}
          path: /payload/content
          shape: blocks
          types: [output_text]
  roots:
    - {path: sessions, archived: false}
    - {path: archived_sessions, archived: true}
operations:
  rename: true
  launch:
    identity: reported_thread
    skip_permissions: [--dangerously-bypass-approvals-and-sandbox]
    session_kind: daemon
    remote: [--remote, "{remote}", -C, "{cwd}"]
    model: -m
    prompt: [--, "{prompt}"]
    probe:
      # `daemon version` only answers while a daemon is already running, so a cold machine
      # reads as no daemon at all. `daemon start` is idempotent, reports the same version
      # and leaves behind the daemon the launch needs anyway.
      args: [app-server, daemon, start]
      minimum_version: "0.154.0"
      version: {format: json_lines, pointer: /cliVersion}
      error: "this codex has no app-server daemon, so a session opened here could not be left running; Codex 0.154 or later has one"
      description: "codex {version}: threads behind the app-server daemon (experimental in Codex)"
  attach:
    args: [--remote, "{remote}", resume, --, "{id}"]
  fork:
    # The daemon makes the fork over `thread/fork`, since a remote `codex fork` refuses the
    # skip flag, and the client joins it with `attach`. These args are not run.
    args: [--remote, "{remote}", fork, --, "{id}"]
    probe:
      args: [--help]
      require_success: false
      contains: [fork]
      error: "this codex does not support native forks"
      description: "codex: native session forks"
  resume:
    args: [--remote, "{remote}", resume, --, "{id}"]
  message:
    args: [--remote, "{remote}", queue, --thread, "{id}", --message, "{text}"]
    probe:
      args: [queue, --help]
      require_success: false
      contains: ["--thread", "--message"]
      error: "this codex has no `queue --thread`, so a coordinator could not deliver a note to a thread"
      description: "codex: queue one note to a live thread"
  btw:
    # An ephemeral headless fork in the read-only sandbox, which writes no rollout. `--sandbox`
    # belongs to `exec`, not to `fork`. Verified against 0.163.0.
    args: [exec, --sandbox, read-only, fork, --ephemeral, --skip-git-repo-check, --output-last-message, "{answer}", --, "{id}", "{text}"]
    probe:
      args: [exec, --help]
      contains: [fork, --sandbox, --ephemeral, --output-last-message]
      error: "this codex has no ephemeral `exec fork`, so a side question would leave a thread behind"
      description: "codex: side questions in a read-only fork it does not save"
  compact: true
  unarchive:
    args: [unarchive, --, "{id}"]
  sessions:
    kinds:
      daemon: {join: codex_remote, remove: forget_client, lifetime: daemon}
execution:
  # A job is a daemon thread started like `cones launch` starts one, unattended through
  # --dangerously-bypass-approvals-and-sandbox (codex_full_access: true), watched through the
  # rollout's own task states. Codex reports no separate request for input.
  enforcement: supported
  result: supported
viewer:
  peek: existing_daemon
  input_alignment: fixed
