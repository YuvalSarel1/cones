version: 2
kind: gemini
icon: "✦"
home:
  env: ""
  default: {base: provided_parent, path: .gemini}
discovery:
  process: gemini
  entrypoints:
    - "@google/gemini-cli/bundle/gemini.js"
    - "@google/gemini-cli/dist/index.js"
  exclude_subcommands: ["--help", "-h", "--version", "auth", "mcp", "extensions", "skills", "hooks"]
transcript:
  available: false
  roots: []
  messages:
    user: {sources: []}
    assistant: {sources: []}
operations:
  launch:
    identity: client_pid
    prompt: [--, "{prompt}"]
    prompt_flag: --prompt-interactive
    model: --model
    probe:
      args: [--help]
      contains: [--prompt-interactive]
      error: "gemini does not support the required native command"
      description: "gemini: terminal launch; external sessions remain in their own terminals"
execution:
  enforcement: unsupported
  result: unsupported
viewer:
  input:
    return_to_list:
      - {key: ctrl+z, when: always}
