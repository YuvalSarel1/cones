version: 2
kind: claude
icon: "✻"
colour: [215, 119, 87]
home:
  env: CLAUDE_CONFIG_DIR
  default: {base: provided}
discovery:
  registry: sessions
transcript:
  messages:
    user:
      id: /uuid
      sources:
        - when: {/type: user}
          unless: [/isMeta, /isSidechain]
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
    assistant:
      id: /message/id
      sources:
        - when: {/type: assistant}
          unless: [/isMeta, /isSidechain]
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
  roots:
    - {path: projects, depth: 1, archived: false}
  statusline:
    directory: statusline
    window_pointer: /context_window/context_window_size
    cost_pointer: /cost/total_cost_usd
    effort_pointer: /effort/level
    dir_pointer: /workspace/current_dir
operations:
  launch:
    identity: background_id
    skip_permissions: [--dangerously-skip-permissions]
    session_kind: bg
    prefix: [--bg]
    model: --model
    effort: --effort
    bedrock: CLAUDE_CODE_USE_BEDROCK
    prompt: [--, "{prompt}"]
    probe:
      args: [--help]
      require_success: false
      contains: [--bg, attach]
      error: "this claude has no --bg or attach, so a session opened here could not be left running; update Claude Code"
      description: "claude: background sessions with a viewer (--bg, attach)"
  attach:
    args: [attach, "{short_id}"]
  fork:
    args: [--resume, "{id}", --fork-session]
    probe:
      args: [--help]
      require_success: false
      contains: [--fork-session]
      error: "this claude does not support native forks"
      description: "claude: native session forks"
  resume:
    args: [--bg, --resume, "{id}"]
  remove:
    args: [rm, "{short_id}"]
  stop:
    args: [stop, "{short_id}"]
    probe:
      # Ask the subcommand itself. A claude without it treats `stop` as a prompt and prints the
      # top-level help, which never names this usage line.
      args: [stop, --help]
      contains: ["Usage: claude stop"]
      error: "this claude has no `stop`, so a background session could only be ended by deleting its job record; update Claude Code"
      description: "claude: stop a background session and keep its conversation"
  message:
    # Claude Code's own cross-session inbox, where SendMessage delivers. Verified against
    # 2.1.278, 2.1.280 and 2.1.281, which all publish peerProtocol 1.
    peer_inbox:
      protocols: [1]
  rename: true
  sessions:
    default: {join: attach, stop: signal, lifetime: daemon}
    kinds:
      bg: {join: attach, stop: remove, lifetime: daemon}
      interactive: {join: unavailable, stop: signal, lifetime: terminal}
execution:
  enforcement: supported
  result: supported
viewer:
  peek: join
  retention: evict_live
  label: attach
