version: 2
kind: claude
icon: "✻"
colour: [215, 119, 87]
home:
  env: CLAUDE_CONFIG_DIR
  default: {base: provided}
discovery:
  registry: sessions
transcript:
  messages:
    user:
      id: /uuid
      sources:
        - when: {/type: user}
          unless: [/isMeta, /isSidechain]
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
    assistant:
      id: /message/id
      sources:
        - when: {/type: assistant}
          unless: [/isMeta, /isSidechain]
          path: /message/content
          shape: string_or_blocks
          types: [text]
          labels: {image: "[image]", input_image: "[image]", document: "[document]"}
  roots:
    - {path: projects, depth: 1, archived: false}
  statusline:
    directory: statusline
    window_pointer: /context_window/context_window_size
operations:
  launch:
    identity: background_id
    session_kind: bg
    prefix: [--bg]
    model: --model
    prompt: [--, "{prompt}"]
    probe:
      args: [--help]
      require_success: false
      contains: [--bg, attach]
      error: "this claude has no --bg or attach, so a session opened here could not be left running; update Claude Code"
      description: "claude: background sessions with a viewer (--bg, attach)"
  attach:
    args: [attach, "{short_id}"]
  resume:
    args: [--bg, --resume, "{id}"]
  remove:
    args: [rm, "{short_id}"]
  rename: true
  sessions:
    default: {join: attach, stop: signal, lifetime: daemon}
    kinds:
      bg: {join: attach, stop: remove, lifetime: daemon}
      interactive: {join: unavailable, stop: signal, lifetime: terminal}
execution:
  enforcement: supported
  result: supported
viewer:
  peek: join
  retention: evict_live
  label: attach
