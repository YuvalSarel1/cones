version: 1
defaults:
  timeout_min: 5
  budget_usd: 0.25
  daily_budget_usd: 2.00
  write: false
columns: [harness, state, context, activity, model, age, last]   # dashboard session columns, see docs/dashboard.md
jobs:
  - name: readme-check
    schedule: "0 9 * * 1-5"
    harness: claude
    cwd: .
    prompt: "Read README.md and summarize the next verification step. Do not modify files."
    model: sonnet
    max_turns: 3
    enabled: true
    archive_transcript: true
