version: 3
defaults:
  timeout_min: 5
  write: false
columns: [harness, state, context, activity, model, age, last]   # dashboard session columns, see docs/jobs.md
jobs:
  - name: readme-check
    schedule: "0 9 * * 1-5"
    harness: claude
    cwd: .
    prompt: "Read README.md and summarize the next verification step. Do not modify files."
    model: sonnet
    enabled: true
    archive_transcript: true
