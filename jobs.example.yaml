version: 3
defaults:
  timeout_min: 5
  write: false
# Optional column overrides; omit them to follow category defaults. See docs/jobs.md.
# columns: [state, context, activity, model, age, last_active, folder, last_reply]
# run_columns: [status, started, duration, model, cost, folder, reason]
# job_columns: [status, schedule, next_run, model, last_run, folder]
# history_columns: [last_active, folder, model, context, last_reply]
jobs:
  - name: readme-check
    schedule: "0 9 * * 1-5"
    harness: claude
    cwd: .
    prompt: "Read README.md and summarize the next verification step. Do not modify files."
    model: sonnet
    enabled: true
    archive_transcript: true
