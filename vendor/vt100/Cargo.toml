# Modified copy of vt100 0.16.2 by Jesse Luehrs (https://github.com/doy/vt100-rust), MIT, see LICENSE.
# cones's changes: a scroll region beginning at row zero contributes to scrollback, unscrolled
# cells can be read while the history view is scrolled, insert-line and scroll-down counts are
# clamped to the scroll region, and a wrap whose row has scrolled away leaves the flag unset
# instead of panicking. See docs/dashboard.md. The version and name below are upstream's because
# [patch.crates-io] matches on them; this is not an upstream release.
[package]
name = "vt100"
version = "0.16.2"
authors = ["Jesse Luehrs <doy@tozt.net>"]
edition = "2021"
rust-version = "1.70"

description = "Library for parsing terminal data"
homepage = "https://github.com/doy/vt100-rust"
repository = "https://github.com/doy/vt100-rust"
readme = false
keywords = ["terminal", "vt100"]
categories = ["command-line-interface", "encoding"]
license = "MIT"
include = ["src/**/*", "LICENSE"]

[dependencies]
itoa = "1.0.15"
unicode-width = "0.2.1"
vte = "0.15.0"
