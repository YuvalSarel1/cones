name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Shells, tmux and sqlite3 that macOS ships and the suites drive.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh tmux sqlite3 lsof
      # One test compiles Claude's argv, which resolves the executable on
      # harness::launch_path(). The assertion is the argument list, so a stub
      # on that path is enough and nothing ever runs it.
      - run: |
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexit 0\n' > ~/.local/bin/claude
          chmod +x ~/.local/bin/claude
      - run: scripts/check
