name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # cones reads macOS process tables and launchd, so it builds nowhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
