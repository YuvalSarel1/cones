name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # cones reads macOS process tables and launchd, so it builds nowhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: scripts/check
