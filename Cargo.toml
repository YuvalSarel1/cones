[package]
name = "cones"
version = "0.1.0"
edition = "2024"
description = "A terminal workspace for coding agents"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/YuvalSarel1/cones"

[dependencies]
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
# The poll backend returns on terminal EOF; the mio backend in 0.29 spins inside read.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
dirs = "6"
fs2 = "0.4"
libc = "0.2"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
tui-markdown = "0.3.9"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
vt100 = "0.16"

[patch.crates-io]
# Preserve history above fixed prompts and inspect live cells while scrolling. See src/viewer.rs.
vt100 = { path = "vendor/vt100" }

[[bin]]
name = "cones"
path = "src/main.rs"
